schema_version: 1
checks:
  - id: manifest/context-fabric-claude
    kind: deterministic
    plugin: context-fabric
    client: claude
    transport: stdio
    evidence_level: community
    executor:
      type: unittest
      target: tests.test_generation.MarketplaceGenerationTests.test_context_fabric_claude_mcp_uses_plugin_root

  - id: manifest/perseus-claude
    kind: deterministic
    plugin: perseus
    client: claude
