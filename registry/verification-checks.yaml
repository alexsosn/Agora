  - id: resource-load/bhsa
    kind: live
    plugin: context-fabric
    provider: context-fabric
    evidence_level: verified
    subject: {type: resource, resource_id: bhsa}
    claims: [materialization, load, representative-content]
    executor:
      type: github-actions
      workflow: .github/workflows/context-fabric-load-smoke.yml
      job: representative-loads
      matrix: {case: bhsa, check_id: resource-load/bhsa}
