  - id: platform-startup/context-fabric-linux-x86-64
    kind: live
    plugin: context-fabric
    client: codex
    transport: stdio
    evidence_level: community
    platform: {os: linux, arch: x86_64}
    executor:
      type: github-actions
      workflow: .github/workflows/external-mcp-smoke.yml
      job: local-runtime-platform
      matrix: {plugin: context-fabric, runner: ubuntu-latest, platform_os: linux, platform_arch: x86_64}
