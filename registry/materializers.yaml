schema_version: 1
plugins:
  - id: pseudepigrapha-tf
    name: Pseudepigrapha-TF
    description: Convert Online Critical Pseudepigrapha XML editions into local Text-Fabric artifacts.
    repository: alexsosn/Pseudepigrapha-TF
    ref: 7c4b757bb543a110ae9a252d1281835859136852
    version: 1.0.0
    release_tracking:
      mode: github-releases
      channel: stable
      tag_prefix: v
    manifest: agora.materializer.json
    package:
      type: python-project
      path: .
      install_trust: explicit-code-execution
    materializers:
      - ocp-text-fabric
    disciplines: [biblical-studies, digital-philology, judaica]
    licenses:
      software: MIT
      data: upstream-dependent
    verification:
      status: community
      notes:
        - Passive fetch validates the immutable upstream source and materializer manifest without executing plugin Python.
        - Explicit installation executes third-party Python packaging/build code and records the resolved runtime, distribution closure, source hash, and managed environment hash.
        - The upstream materializer contract remains exercised by Agora's sandboxed Pseudepigrapha-TF reference materialization.

  - id: copticscriptorium-tf
    name: CopticScriptorium-TF
    description: Convert Coptic Scriptorium TT source trees into local native Text-Fabric artifacts.
    repository: alexsosn/CopticScriptorium-TF
    ref: 3cde20ec41efb1cacf1710643f01f924f11cbf0b
    version: 0.1.0
    manifest: agora.materializer.json
    package:
      type: python-project
      path: .
      install_trust: explicit-code-execution
    materializers:
      - copticscriptorium-text-fabric
    disciplines: [biblical-studies, digital-philology]
    licenses:
      software: MIT
      data: upstream-dependent
    verification:
      status: community
      notes:
        - Passive fetch validates the immutable upstream source and materializer manifest without executing plugin Python.
        - Explicit installation executes third-party Python packaging/build code and records the resolved runtime, distribution closure, source hash, and managed environment hash.
        - Registered execution is sandboxed and network-denied; consumer discovery/load of produced local artifacts is a separate integration boundary.
