schema_version: 1
plugins:
  - id: context-fabric
    name: Context-Fabric
    description: Load, inspect, and query Text-Fabric-format corpora through Context-Fabric MCP.
    disciplines: [digital-philology]
    upstream:
      repository: Context-Fabric/context-fabric
      homepage: https://context-fabric.ai/
    runtime:
      mode: local
      type: python
      notes: Agora bundles resource discovery and lazy acquisition around cfabric-mcp 0.1.7; corpora remain external and are materialized only when selected.
    data_mode: local
    capabilities:
      - corpus-discovery
      - corpus-acquisition
      - corpus-loading
      - structured-search
      - feature-inspection
    licenses:
      software: upstream
      data: resource-specific
    verification:
      status: experimental
      notes:
        - Agora runtime, lazy resource resolver, collection discovery, and Claude/Codex launch metadata are implemented and covered by deterministic tests.
        - Upstream repository structure is checked separately by the Context-Fabric network audit before this integration can be promoted to verified.

  - id: perseus
    name: Perseus MCP
    description: Access Perseus and Scaife text discovery, CTS passages, and search through tonyjurg/Perseus-mcp.
    disciplines: [classics, digital-philology]
    upstream:
      repository: tonyjurg/Perseus-mcp
    runtime:
      mode: local
      type: python
      notes: Claude and Codex launch the upstream perseus-mcp 1.0.2 package directly through uvx; Agora does not vendor or fork the server.
    data_mode: remote
    capabilities:
      - corpus-discovery
      - passage-retrieval
      - full-text-search
      - cts-navigation
    licenses:
      software: MIT
      data: upstream-dependent
    verification:
      status: experimental
      notes:
        - Cross-client MCP packaging is implemented against upstream perseus-mcp 1.0.2.
        - Promotion requires a live MCP handshake and representative Perseus/Scaife scholarly smoke tests.

  - id: sefaria
    name: Sefaria
    description: Search and retrieve Jewish texts and linked resources through the official Sefaria Texts MCP.
    disciplines: [judaica, biblical-studies, digital-philology]
    upstream:
      repository: Sefaria/sefaria-mcp
      homepage: https://developers.sefaria.org/docs/the-sefaria-mcp
      endpoint: https://mcp.sefaria.org/sse
    runtime:
      mode: hosted
      notes: Claude connects directly to Sefaria's hosted Texts MCP over SSE; Codex bridges the same legacy SSE endpoint to stdio with mcp-proxy 0.12.0 because current Codex plugin MCP support does not accept legacy SSE directly.
    data_mode: remote
    capabilities:
      - passage-retrieval
      - full-text-search
      - reference-resolution
      - linked-text-navigation
      - dictionary-lookup
    licenses:
      software: MIT
      data: upstream-dependent
      service_terms: upstream-dependent
    verification:
      status: experimental
      notes:
        - Cross-client launch metadata is implemented against Sefaria's official hosted Texts MCP endpoint.
        - Promotion requires live tool discovery and representative text/search/link smoke tests.

  - id: sedra
    name: SEDRA
    description: Syriac lexical and morphological lookup against Beth Mardutho's Syriac Electronic Data Research Archive.
    disciplines: [syriac-studies, semitic-linguistics, digital-philology]
    upstream:
      homepage: https://sedra.bethmardutho.org/
    runtime:
      mode: local
      type: python
      notes: Agora ships a small read-only FastMCP adapter over Beth Mardutho's public SEDRA IV JSON word and lexeme endpoints; no SEDRA data is vendored.
    data_mode: remote
    capabilities:
      - dictionary-lookup
      - lexeme-lookup
    licenses:
      software: MIT
      data: upstream-dependent
      service_terms: upstream-dependent
    verification:
      status: experimental
      notes:
        - The Agora adapter has deterministic tests for Syriac URL encoding, JSON/error handling, and tool delegation.
        - Promotion requires a live SEDRA API smoke test and MCP handshake.
