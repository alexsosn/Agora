schema_version: 1
providers:
  - id: context-fabric
    name: Context-Fabric
    plugin: context-fabric
    description: Local Context-Fabric runtime over Text-Fabric-format corpus data.
    access:
      runtime_mode: local
      data_mode: local
    upstream:
      repository: Context-Fabric/context-fabric
      homepage: https://context-fabric.ai/
    health:
      status: observed-operational
      evidence:
        - check_id: mcp-live/context-fabric-codex
      notes:
        - A live Agora smoke has observed the provider runtime starting and answering a published tool call; client-specific evidence strength remains on the plugin record.

  - id: perseus
    name: Perseus / Scaife
    plugin: perseus
    description: Remote Perseus and Scaife scholarly text services exposed through a local MCP server.
    access:
      runtime_mode: local
      data_mode: remote
    upstream:
      repository: tonyjurg/Perseus-mcp
    health:
      status: observed-operational
      evidence:
        - check_id: mcp-live/perseus-codex
      notes:
        - A live Agora smoke has observed the provider path completing a real upstream discovery call; this does not assess upstream search or data semantics.

  - id: sefaria
    name: Sefaria Library
    plugin: sefaria
    description: Hosted official Sefaria Texts MCP over the Sefaria Library.
    access:
      runtime_mode: hosted
      data_mode: remote
    upstream:
      repository: Sefaria/sefaria-mcp
      endpoint: https://mcp.sefaria.org/sse
    health:
      status: observed-operational
      evidence:
        - check_id: mcp-live/sefaria-codex
      notes:
        - A live Agora smoke has observed the hosted provider through the Codex stdio/SSE bridge; Claude and Codex integration evidence remains separate.

  - id: sedra
    name: Beth Mardutho SEDRA IV
    plugin: sedra
    description: Syriac Electronic Data Research Archive used by the local Agora SEDRA MCP adapter.
    access:
      runtime_mode: local
      data_mode: remote
    upstream:
      homepage: https://sedra.bethmardutho.org/
    health:
      status: observed-operational
      evidence:
        - check_id: mcp-live/sedra-codex
      notes:
        - A live Agora smoke has observed the provider path completing a real SEDRA lookup; resource and data quality remain separate dimensions.
