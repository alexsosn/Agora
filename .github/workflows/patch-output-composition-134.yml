name: Patch output composition 134

on:
  push:
    branches:
      - feat/materializer-output-composition-134

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[composition-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/materializer-output-composition-134
      - name: Patch trusted output provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agora_materialize.py')
          text = path.read_text(encoding='utf-8')
          old = '''        provenance = {\n            "schema_version": 1,\n'''
          new = '''        output_provenance = {"format": spec["output"]["format"]}\n        if "composition" in spec["output"]:\n            output_provenance["composition"] = json.loads(\n                json.dumps(spec["output"]["composition"])\n            )\n\n        provenance = {\n            "schema_version": 1,\n'''
          if old not in text:
              raise SystemExit('expected provenance insertion point not found')
          text = text.replace(old, new, 1)
          old_output = '''            "output": {"format": spec["output"]["format"]},\n'''
          if old_output not in text:
              raise SystemExit('expected output provenance line not found')
          text = text.replace(old_output, '''            "output": output_provenance,\n''', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/agora_materialize.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/agora_materialize.py
          git commit -m 'Preserve output composition in provenance [composition-patched]'
          git push origin HEAD:feat/materializer-output-composition-134
