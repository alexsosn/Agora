# GREEN5: deterministic review-only corpus proposal automation.
ROOT = Path(__file__).resolve().parents[1]


def _require_mapping(value: Any, *, where: str) -> dict[str, Any]:
    if not isinstance(value, dict):
        raise ReleaseDiscoveryError(f"{where} must be a mapping")
    return value


def _resource_state(resource: dict[str, Any]) -> dict[str, Any]:
    upstream = _require_mapping(resource.get("upstream"), where=f"resource {resource.get('id')!r} upstream")
    tracking = _require_mapping(resource.get("version_tracking"), where=f"resource {resource.get('id')!r} version_tracking")
    accepted = _require_mapping(tracking.get("accepted"), where=f"resource {resource.get('id')!r} accepted state")
    return {
        "publication_version": accepted.get("publication_version"),
        "signal": accepted.get("signal"),
        "source_revision": upstream.get("ref"),
        "tf_path": upstream.get("tf_path"),
    }


def _replace_inline_value(line: str, key: str, replacement: str, *, resource_id: str) -> str:
    pattern = re.compile(rf"(\b{re.escape(key)}:\s*)([^,}}]+)")
    matches = list(pattern.finditer(line))
    if len(matches) != 1:
        raise ReleaseDiscoveryError(
            f"resource {resource_id!r} must have exactly one inline {key!r} value"
        )
    return pattern.sub(lambda match: match.group(1) + replacement, line, count=1)


def _section_range(lines: list[str], *, start: int, indent: int) -> tuple[int, int]:
    prefix = " " * indent
    end = len(lines)
    for index in range(start + 1, len(lines)):
        raw = lines[index]
        if not raw.strip():
            continue
        leading = len(raw) - len(raw.lstrip(" "))
        if leading <= indent and not raw.startswith(prefix + "-"):
            end = index
            break
    return start, end


def _replace_nested_scalar(
    lines: list[str],
    *,
    start: int,
    end: int,
    indent: int,
    key: str,
    replacement: str,
    resource_id: str,
) -> None:
    prefix = " " * indent + key + ":"
    matches = [index for index in range(start + 1, end) if lines[index].startswith(prefix)]
    if len(matches) != 1:
        raise ReleaseDiscoveryError(
            f"resource {resource_id!r} must have exactly one canonical {key!r} line"
        )
    index = matches[0]
    line = lines[index]
    ending = "\r\n" if line.endswith("\r\n") else "\n" if line.endswith("\n") else ""
    body = line[:-len(ending)] if ending else line
    comment = ""
    hash_index = body.find(" #")
    if hash_index >= 0:
        comment = body[hash_index:]
    lines[index] = f"{' ' * indent}{key}: {replacement}{comment}{ending}"


def _patch_upstream(lines: list[str], *, candidate: dict[str, Any], resource_id: str) -> None:
    matches = [i for i, line in enumerate(lines) if line.startswith("  upstream:")]
    if len(matches) != 1:
        raise ReleaseDiscoveryError(f"resource {resource_id!r} must have one upstream mapping")
    start = matches[0]
    line = lines[start]
    if "{" in line:
        line = _replace_inline_value(line, "ref", str(candidate["source_revision"]), resource_id=resource_id)
        line = _replace_inline_value(line, "tf_path", str(candidate["tf_path"]), resource_id=resource_id)
        lines[start] = line
        return
    _, end = _section_range(lines, start=start, indent=2)
    _replace_nested_scalar(lines, start=start, end=end, indent=4, key="ref", replacement=str(candidate["source_revision"]), resource_id=resource_id)
    _replace_nested_scalar(lines, start=start, end=end, indent=4, key="tf_path", replacement=str(candidate["tf_path"]), resource_id=resource_id)


def _patch_accepted(lines: list[str], *, candidate: dict[str, Any], resource_id: str) -> None:
    tracking = [i for i, line in enumerate(lines) if line.startswith("  version_tracking:")]
    if len(tracking) != 1:
        raise ReleaseDiscoveryError(f"resource {resource_id!r} must have one version_tracking mapping")
    _, tracking_end = _section_range(lines, start=tracking[0], indent=2)
    accepted = [
        i for i in range(tracking[0] + 1, tracking_end)
        if lines[i].startswith("    accepted:")
    ]
    if len(accepted) != 1:
        raise ReleaseDiscoveryError(f"resource {resource_id!r} must have one accepted tracking state")
    start = accepted[0]
    if "{" in lines[start]:
        line = lines[start]
        for key in ("publication_version", "signal", "source_revision", "tf_path"):
            line = _replace_inline_value(line, key, str(candidate[key]), resource_id=resource_id)
        lines[start] = line
        return
    _, end = _section_range(lines, start=start, indent=4)
    for key in ("publication_version", "signal", "source_revision", "tf_path"):
        _replace_nested_scalar(lines, start=start, end=end, indent=6, key=key, replacement=str(candidate[key]), resource_id=resource_id)


def _patch_verification(lines: list[str], *, status: str, resource_id: str) -> None:
    matches = [i for i, line in enumerate(lines) if line.startswith("  verification:")]
    if len(matches) != 1:
        raise ReleaseDiscoveryError(f"resource {resource_id!r} must have one verification mapping")
    start = matches[0]
    ending = "\r\n" if lines[start].endswith("\r\n") else "\n"
    if "{" in lines[start]:
        lines[start] = f"  verification: {{status: {status}}}{ending}"
        return
    _, end = _section_range(lines, start=start, indent=2)
    lines[start:end] = [f"  verification:{ending}", f"    status: {status}{ending}"]


def _patch_resource_block(block: str, promotion: dict[str, Any]) -> str:
    resource_id = str(promotion["resource_id"])
    candidate = _require_mapping(promotion.get("candidate"), where=f"promotion {resource_id!r} candidate")
    status = promotion.get("verification_status")
    if status not in {"experimental", "community", "verified"}:
        raise ReleaseDiscoveryError(f"promotion for {resource_id!r} has invalid verification status")
    lines = block.splitlines(keepends=True)
    _patch_upstream(lines, candidate=candidate, resource_id=resource_id)
    _patch_verification(lines, status=str(status), resource_id=resource_id)
    _patch_accepted(lines, candidate=candidate, resource_id=resource_id)
    return "".join(lines)


def apply_promotions_to_text(
    original_text: str,
    parsed_registry: dict[str, Any],
    promotions: list[dict[str, Any]],
) -> str:
    """Apply only policy-owned corpus promotion fields while preserving other YAML bytes."""

    if not isinstance(parsed_registry, dict) or not isinstance(parsed_registry.get("resources"), list):
        raise ReleaseDiscoveryError("resource registry must contain a resources list")
    if not promotions:
        return original_text

    by_id: dict[str, dict[str, Any]] = {}
    for promotion in promotions:
        if not isinstance(promotion, dict) or not isinstance(promotion.get("resource_id"), str):
            raise ReleaseDiscoveryError("promotion records require a resource_id")
        resource_id = promotion["resource_id"]
        if resource_id in by_id:
            raise ReleaseDiscoveryError(f"duplicate promotion for resource {resource_id!r}")
        by_id[resource_id] = promotion

    resources = parsed_registry["resources"]
    resource_by_id = {resource.get("id"): resource for resource in resources if isinstance(resource, dict)}
    unknown = set(by_id) - set(resource_by_id)
    if unknown:
        raise ReleaseDiscoveryError(f"promotion targets missing resources: {sorted(unknown)!r}")

    expected = copy.deepcopy(parsed_registry)
    expected_by_id = {resource["id"]: resource for resource in expected["resources"]}
    active: dict[str, dict[str, Any]] = {}
    for resource_id in sorted(by_id):
        promotion = by_id[resource_id]
        resource = resource_by_id[resource_id]
        previous = _require_mapping(promotion.get("previous"), where=f"promotion {resource_id!r} previous")
        candidate = _require_mapping(promotion.get("candidate"), where=f"promotion {resource_id!r} candidate")
        current = _resource_state(resource)
        target = {
            "publication_version": candidate.get("publication_version"),
            "signal": candidate.get("signal"),
            "source_revision": candidate.get("source_revision"),
            "tf_path": candidate.get("tf_path"),
        }
        status = promotion.get("verification_status")
        verification = resource.get("verification")
        current_status = verification.get("status") if isinstance(verification, dict) else None
        current_evidence = verification.get("evidence") if isinstance(verification, dict) else None
        if current == target and current_status == status and current_evidence is None:
            continue
        if current != previous:
            raise ReleaseDiscoveryError(
                f"resource {resource_id!r} changed since discovery: expected state {previous!r}, got {current!r}"
            )
        if status not in {"experimental", "community", "verified"}:
            raise ReleaseDiscoveryError(f"promotion for {resource_id!r} has invalid verification status")
        active[resource_id] = promotion
        target_resource = expected_by_id[resource_id]
        target_resource["upstream"]["ref"] = candidate["source_revision"]
        target_resource["upstream"]["tf_path"] = candidate["tf_path"]
        target_resource["version_tracking"]["accepted"] = target
        target_resource["verification"] = {"status": status}

    if not active:
        return original_text

    lines = original_text.splitlines(keepends=True)
    marker = re.compile(r"^- id: ([a-z0-9][a-z0-9-]*)(?:\r?\n)?$")
    starts: list[tuple[int, str]] = []
    seen: set[str] = set()
    for index, line in enumerate(lines):
        match = marker.fullmatch(line)
        if match is None:
            continue
        resource_id = match.group(1)
        if resource_id in seen:
            raise ReleaseDiscoveryError(f"duplicate canonical YAML block for resource {resource_id!r}")
        seen.add(resource_id)
        starts.append((index, resource_id))

    ranges: dict[str, tuple[int, int]] = {}
    for position, (start, resource_id) in enumerate(starts):
        end = starts[position + 1][0] if position + 1 < len(starts) else len(lines)
        ranges[resource_id] = (start, end)
    missing = set(active) - set(ranges)
    if missing:
        raise ReleaseDiscoveryError(f"canonical YAML blocks missing for resources: {sorted(missing)!r}")

    changed = original_text
    # Character spans avoid line-number drift when verification evidence is removed.
    offsets: list[int] = [0]
    for line in lines:
        offsets.append(offsets[-1] + len(line))
    replacements: list[tuple[int, int, str]] = []
    for resource_id in sorted(active):
        start, end = ranges[resource_id]
        replacements.append(
            (offsets[start], offsets[end], _patch_resource_block("".join(lines[start:end]), active[resource_id]))
        )
    for start, end, replacement in sorted(replacements, reverse=True):
        changed = changed[:start] + replacement + changed[end:]

    try:
        reparsed = yaml.safe_load(changed)
    except yaml.YAMLError as exc:
        raise ReleaseDiscoveryError(f"proposed resource registry patch is invalid YAML: {exc}") from exc
    if reparsed != expected:
        raise ReleaseDiscoveryError(
            "proposed resource registry patch changed semantics outside policy-owned promotion fields"
        )
    return changed


def discover_promotions(
    registry: dict[str, Any],
    feature_modules: list[dict[str, Any]],
    api: Any,
) -> tuple[list[dict[str, Any]], list[dict[str, Any]]]:
    """Passively discover Stage-A proposals; any blocked selected candidate fails the aggregate."""

    if not isinstance(registry, dict) or not isinstance(registry.get("resources"), list):
        raise ReleaseDiscoveryError("resource registry must contain a resources list")
    promotions: list[dict[str, Any]] = []
    observations: list[dict[str, Any]] = []
    blocked: list[str] = []
    for resource in registry["resources"]:
        if not isinstance(resource, dict):
            raise ReleaseDiscoveryError("resource registry contains a malformed resource record")
        tracking = resource.get("version_tracking")
        if not isinstance(tracking, dict):
            continue
        promotion_policy = tracking.get("promotion")
        promotion_mode = promotion_policy.get("mode") if isinstance(promotion_policy, dict) else None
        try:
            source = discover_source_candidate(resource, api)
            if source is None:
                continue
            candidate = discover_dataset_candidate(resource, source, api)
            stage_a = assess_stage_a_candidate(resource, candidate, feature_modules=feature_modules)
        except (ReleaseDiscoveryError, ValueError, TypeError) as exc:
            raise ReleaseDiscoveryError(f"{resource.get('id', '<unknown>')}: {exc}") from exc
        observation = {
            "resource_id": candidate.resource_id,
            "publication_version": candidate.publication_version,
            "signal": candidate.signal,
            "source_revision": candidate.source_revision,
            "tf_path": candidate.tf_path,
            "release_url": candidate.release_url,
            "promotion_mode": promotion_mode,
            "verification_status": stage_a["verification_status"],
            "blocking_reasons": list(stage_a["blocking_reasons"]),
            "caveats": list(stage_a["caveats"]),
        }
        observations.append(observation)
        if stage_a["blocking_reasons"]:
            blocked.append(
                f"{candidate.resource_id}: " + "; ".join(stage_a["blocking_reasons"])
            )
            continue
        if promotion_mode != "proposal":
            continue
        accepted = tracking.get("accepted")
        if not isinstance(accepted, dict):
            raise ReleaseDiscoveryError(
                f"proposal resource {candidate.resource_id!r} has no reviewed accepted state"
            )
        promotions.append(
            {
                "resource_id": candidate.resource_id,
                "previous": {
                    "publication_version": accepted.get("publication_version"),
                    "signal": accepted.get("signal"),
                    "source_revision": accepted.get("source_revision"),
                    "tf_path": accepted.get("tf_path"),
                },
                "candidate": {
                    "publication_version": candidate.publication_version,
                    "signal": candidate.signal,
                    "source_revision": candidate.source_revision,
                    "tf_path": candidate.tf_path,
                },
                "verification_status": stage_a["verification_status"],
            }
        )
    if blocked:
        raise ReleaseDiscoveryError(
            "selected corpus candidate(s) are blocked; refusing a partial aggregate proposal: "
            + " | ".join(blocked)
        )
    promotions.sort(key=lambda item: item["resource_id"])
    observations.sort(key=lambda item: item["resource_id"])
    return promotions, observations


def _write_atomic(path: Path, text: str) -> None:
    path.parent.mkdir(parents=True, exist_ok=True)
    fd, temporary_name = tempfile.mkstemp(prefix=f".{path.name}.corpus-version-", dir=path.parent)
    temporary = Path(temporary_name)
    try:
        with os.fdopen(fd, "w", encoding="utf-8", newline="") as stream:
            stream.write(text)
            stream.flush()
            os.fsync(stream.fileno())
        os.replace(temporary, path)
    finally:
        if temporary.exists():
            temporary.unlink()


def render_pr_body(observations: list[dict[str, Any]]) -> str:
    lines = [
        "## Automated corpus version proposals",
        "",
        "Agora passively resolved upstream publication state to immutable commits and inspected Text-Fabric dataset roots without executing upstream code.",
        "",
        "| Resource | Publication | Resolved commit | TF path | Proposed verification | Caveats |",
        "| --- | --- | --- | --- | --- | --- |",
    ]
    for item in observations:
        caveats = "; ".join(item.get("caveats", [])) or "—"
        publication = item.get("publication_version") or item.get("signal") or "—"
        lines.append(
            f"| `{item['resource_id']}` | `{publication}` | `{item['source_revision']}` | "
            f"`{item['tf_path']}` | `{item['verification_status']}` | {caveats} |"
        )
    lines.extend(
        [
            "",
            "This is a review-only Stage-A proposal. Changed dataset identity invalidates stale verified evidence; this automation never restores `verified` from its own run and never auto-merges.",
            "",
        ]
    )
    return "\n".join(lines)


def _parser() -> argparse.ArgumentParser:
    parser = argparse.ArgumentParser(description="Passively discover reviewable corpus version updates.")
    parser.add_argument("--registry", type=Path, default=ROOT / "registry/resources.yaml")
    parser.add_argument("--feature-modules", type=Path, default=ROOT / "registry/feature-modules.yaml")
    parser.add_argument("--report", type=Path, default=None)
    parser.add_argument("--pr-body", type=Path, default=None)
    parser.add_argument("--apply", action="store_true")
    return parser


def main(argv: list[str] | None = None) -> int:
    args = _parser().parse_args(argv)
    try:
        original = args.registry.read_text(encoding="utf-8")
        registry = yaml.safe_load(original)
        modules_doc = yaml.safe_load(args.feature_modules.read_text(encoding="utf-8"))
        if not isinstance(modules_doc, dict) or not isinstance(modules_doc.get("modules"), list):
            raise ReleaseDiscoveryError("feature-module registry must contain a modules list")
        # Cross-repository upstream discovery is intentionally unauthenticated.
        promotions, observations = discover_promotions(registry, modules_doc["modules"], public_github_api())
        changed = original
        state = "no-update"
        if promotions:
            state = "updates-available"
            if args.apply:
                changed = apply_promotions_to_text(original, registry, promotions)
                if changed != original:
                    _write_atomic(args.registry, changed)
                    state = "updated"
                else:
                    state = "no-update"
        payload = {"schema_version": 1, "state": state, "promotions": promotions, "observations": observations}
        if args.report is not None:
            _write_atomic(args.report, json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n")
        if args.pr_body is not None:
            _write_atomic(args.pr_body, render_pr_body(observations))
        print(json.dumps(payload, sort_keys=True))
        return 0
    except (OSError, UnicodeDecodeError, yaml.YAMLError, ReleaseDiscoveryError, ValueError, TypeError) as exc:
        payload = {"schema_version": 1, "state": "error", "error": str(exc), "promotions": [], "observations": []}
        if args.report is not None:
            try:
                _write_atomic(args.report, json.dumps(payload, indent=2, sort_keys=True) + "\n")
            except OSError:
                pass
        print(f"corpus version discovery failed: {exc}", file=sys.stderr)
        return 1


if __name__ == "__main__":
    raise SystemExit(main())
