          new = '''from dataclasses import dataclass\nfrom pathlib import Path, PurePosixPath\nimport argparse\nimport copy\nimport json\nimport os\nimport re\nimport sys\nimport tempfile\nfrom typing import Any, Callable\n\nimport yaml\n'''
