name: Load-cost prune generated churn

on:
  push:
    branches: [feat/resource-load-cost-38]

permissions:
  contents: write

jobs:
  clean:
    if: contains(github.event.head_commit.message, '[load-cost-prune-churn]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resource-load-cost-38
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore unrelated generated formatting
        run: |
          git fetch origin main
          git checkout origin/main -- plugins/context-fabric/resources/feature-modules.yaml
          rm -f .github/workflows/agent-load-cost-prune-generated-churn.yml
      - name: Validate semantic freshness and focused contracts
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/generate_context_fabric_catalog.py --check
          python scripts/validate_registry.py
          python -m unittest tests.test_resource_load_cost tests.test_resource_load_cost_feature_module_red tests.test_resource_load_cost_review_regressions -v
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "Agora agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: keep load-cost diff scoped"
          git push origin HEAD:feat/resource-load-cost-38
