name: Load-cost review RED

on:
  push:
    branches: [feat/resource-load-cost-38]

permissions:
  contents: read

jobs:
  regression:
    if: contains(github.event.head_commit.message, '[load-cost-review-red]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resource-load-cost-38
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Run review regression only
        run: python -m unittest tests.test_resource_load_cost_review_regressions -v
