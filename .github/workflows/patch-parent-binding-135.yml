name: Patch parent binding 135 GREEN1

on:
  push:
    branches:
      - feat/materializer-parent-input-135-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[parent-green1]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/materializer-parent-input-135-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply minimal manifest and binding GREEN
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('registry/schema/materializer-plugin.schema.json')
          text = schema.read_text(encoding='utf-8')
          old = '"pattern": "^(?:[^{}]|\\\\{(?:source|output|source_revision)\\\\})*$"'
          new = '"pattern": "^(?:[^{}]|\\\\{(?:source|output|source_revision|parent)\\\\})*$"'
          if text.count(old) != 1:
              raise SystemExit('expected executionArgument pattern not found exactly once')
          schema.write_text(text.replace(old, new, 1), encoding='utf-8')

          host = Path('scripts/agora_materialize.py')
          text = host.read_text(encoding='utf-8')

          anchor = '''class AcquisitionError(RuntimeError):\n    """Automatic acquisition failed for an environmental/network reason."""\n\n\n'''
          addition = '''class AcquisitionError(RuntimeError):\n    """Automatic acquisition failed for an environmental/network reason."""\n\n\n@dataclass(frozen=True)\nclass ParentResourceBinding:\n    """Trusted identity and prepared local path for a feature-module parent."""\n\n    resource_id: str\n    version: str\n    source_revision: str\n    path: Path\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('ParentResourceBinding insertion point not found exactly once')
          text = text.replace(anchor, addition, 1)

          anchor = '''class StagingOutput:\n    root: Path\n    output: Path\n\n    def cleanup(self) -> None:\n        shutil.rmtree(self.root, ignore_errors=True)\n\n\n'''
          addition = anchor + '''def validate_parent_binding(\n    materializer: dict[str, Any],\n    binding: ParentResourceBinding,\n) -> ParentResourceBinding:\n    """Validate a prepared parent against trusted feature-module composition metadata."""\n\n    composition = materializer["output"].get("composition")\n    if not isinstance(composition, dict) or composition.get("kind") != "feature-module":\n        raise ValueError("parent binding is valid only for a feature-module composition")\n    if binding.resource_id != composition["parent"]:\n        raise ValueError("parent resource id does not match feature-module composition parent")\n    compatible_versions = composition["compatibility"]["parent_versions"]\n    if binding.version not in compatible_versions:\n        raise ValueError("parent version is not compatible with feature-module composition")\n    revision = binding.source_revision\n    if len(revision) not in (40, 64) or any(\n        char.lower() not in "0123456789abcdef" for char in revision\n    ):\n        raise ValueError("parent source revision must be a full immutable hex digest")\n    path = Path(binding.path).expanduser()\n    if not path.is_dir():\n        raise ValueError("parent resource path must exist as a directory")\n    return ParentResourceBinding(\n        resource_id=binding.resource_id,\n        version=binding.version,\n        source_revision=binding.source_revision,\n        path=path.resolve(),\n    )\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('validate_parent_binding insertion point not found exactly once')
          text = text.replace(anchor, addition, 1)

          anchor = '''        ids.add(materializer_id)\n\n        seen_types: set[str] = set()\n'''
          replacement = '''        ids.add(materializer_id)\n\n        uses_parent = any(\n            "{parent}" in arg for arg in materializer["execution"]["args"]\n        )\n        composition = materializer["output"].get("composition")\n        if uses_parent and not (\n            isinstance(composition, dict)\n            and composition.get("kind") == "feature-module"\n        ):\n            raise ManifestError(\n                f"materializers[{index}] uses {{parent}} without feature-module composition"\n            )\n\n        seen_types: set[str] = set()\n'''
          if text.count(anchor) != 1:
              raise SystemExit('manifest semantic insertion point not found exactly once')
          text = text.replace(anchor, replacement, 1)
          host.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Run focused GREEN1 contract
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest tests.test_materializer_parent_input -v
      - name: Commit GREEN1 and remove patch runner
        shell: bash
        run: |
          rm .github/workflows/patch-parent-binding-135.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/schema/materializer-plugin.schema.json scripts/agora_materialize.py .github/workflows/patch-parent-binding-135.yml
          git commit -m 'Implement parent binding validation [parent-green1]'
          git push origin HEAD:feat/materializer-parent-input-135-v2
