name: Temporary runtime dependency snapshot generation

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-generate-runtime-snapshots.yml"

permissions:
  contents: write

jobs:
  generate:
    if: >-
      github.head_ref == 'feat/14-reproducible-runtime-dependencies' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/14-reproducible-runtime-dependencies
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Generate universal project locks
        run: |
          uv lock --project plugins/context-fabric
          uv lock --project plugins/sedra
          uv lock --project verification/mcp-smoke

      - name: Generate universal uvx constraints
        run: |
          uv pip compile --universal --python-version 3.13 --no-header --no-annotate \
            plugins/perseus/runtime-requirements.in \
            -o plugins/perseus/runtime-constraints.txt
          uv pip compile --universal --python-version 3.13 --no-header --no-annotate \
            plugins/sefaria/runtime-requirements.in \
            -o plugins/sefaria/runtime-constraints.txt

      - name: Commit generated snapshots
        run: |
          git add \
            plugins/context-fabric/uv.lock \
            plugins/sedra/uv.lock \
            verification/mcp-smoke/uv.lock \
            plugins/perseus/runtime-constraints.txt \
            plugins/sefaria/runtime-constraints.txt
          if git diff --cached --quiet; then
            echo "Dependency snapshots already generated."
            exit 0
          fi
          git config user.name "Agora CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "build: resolve runtime dependency snapshots"
          git push origin HEAD:feat/14-reproducible-runtime-dependencies
