name: Temporary CAL researcher documentation renderer

on:
  push:
    paths:
      - ".github/workflows/cal-docs-render.yml"
      - "scripts/generate_plugin_docs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Render canonical CAL page to ephemeral CI stdout (no publish)
        run: |
          python - <<'PY'
          import json
          from scripts.generate_plugin_docs import _load, render
          plugin = next(x for x in _load() if x["id"] == "cal")
          print("CAL_GUIDE_JSON=" + json.dumps(render(plugin), ensure_ascii=True))
          PY
