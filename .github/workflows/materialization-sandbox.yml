name: Materialization sandbox E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialization-sandbox.yml'
      - 'registry/schema/materializer-plugin.schema.json'
      - 'scripts/agora_materialize.py'
      - 'tests/test_materialization*.py'
  pull_request:
    paths:
      - '.github/workflows/materialization-sandbox.yml'
      - 'registry/schema/materializer-plugin.schema.json'
      - 'scripts/agora_materialize.py'
      - 'tests/test_materialization*.py'

permissions:
  contents: read

jobs:
  sandbox-e2e:
    name: Real sandbox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      AGORA_REQUIRE_SANDBOX_E2E: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow bubblewrap user/network namespaces on Ubuntu runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify sandbox backend exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            command -v bwrap
            bwrap --unshare-all --ro-bind / / /bin/true
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            command -v sandbox-exec
          fi

      - name: Run real sandbox materialization E2E
        run: python -m unittest discover -s tests -p 'test_materialization_sandbox_e2e.py' -v

      - name: Show recent macOS sandbox denials on failure
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          log show --last 2m --style compact \
            --predicate 'process == "sandboxd" OR subsystem == "com.apple.sandbox"' \
            | tail -n 200 || true

  reference-materializer:
    name: Pseudepigrapha-TF reference materialization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCP_COMMIT: 2d1d14d23434a784d377ff7f4409ccdb2d18aafb
      PSEUDEPIGRAPHA_TF_COMMIT: fb837dca52bf2f9f86b628d84f7928c7ec93fede
    steps:
      - name: Check out Agora
        uses: actions/checkout@v4

      - name: Check out pinned reference materializer
        uses: actions/checkout@v4
        with:
          repository: alexsosn/Pseudepigrapha-TF
          ref: ${{ env.PSEUDEPIGRAPHA_TF_COMMIT }}
          path: .reference/pseudepigrapha-tf
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install host and reference dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .reference/pseudepigrapha-tf

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow bubblewrap user/network namespaces on Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true

      - name: Materialize pinned OCP source through Agora
        run: |
          python scripts/agora_materialize.py \
            --manifest .reference/pseudepigrapha-tf/agora.materializer.json \
            --materializer ocp-text-fabric \
            --output "$RUNNER_TEMP/pseudepigrapha-tf"

      - name: Verify integration provenance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = Path(os.environ['RUNNER_TEMP']) / 'pseudepigrapha-tf'
          expected = os.environ['OCP_COMMIT']
          host = json.loads((artifact / 'agora-materialization.json').read_text(encoding='utf-8'))
          report = json.loads((artifact / 'conversion-report.json').read_text(encoding='utf-8'))

          assert host['plugin']['id'] == 'pseudepigrapha-tf'
          assert host['materializer'] == 'ocp-text-fabric'
          assert host['source']['requested_ref'] == expected
          assert host['source']['resolved_commit'] == expected
          assert host['sandbox'] == 'bubblewrap'
          assert report['provenance']['upstream_commit'] == expected

          tf_metadata = '\n'.join(
              path.read_text(encoding='utf-8', errors='replace')
              for path in artifact.glob('*.tf')
          )
          assert f'@upstreamCommit={expected}' in tf_metadata
          PY
