name: PR145 focused RED2

on:
  push:
    branches:
      - update/144-pseudepigrapha-v0.2.0
    paths:
      - .github/workflows/agent-pr145-red2.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/144-pseudepigrapha-v0.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - name: Run focused promotion regressions
        run: python -m unittest tests.test_pseudepigrapha_materializer_promotion -v
