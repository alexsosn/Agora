name: PR145 one-shot test GREEN helper

on:
  push:
    branches:
      - update/144-pseudepigrapha-v0.2.0
    paths:
      - .github/workflows/agent-pr145-red2.yml

permissions:
  contents: write

jobs:
  green-test-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/144-pseudepigrapha-v0.2.0
          fetch-depth: 0
      - name: Guard exact invocation and update stale test identity
        shell: bash
        env:
          EXPECTED_BEFORE: 72496bf5e3a414bc6c6ac38a68cfa84c2eafc524
        run: |
          set -euo pipefail
          test "${{ github.event.before }}" = "$EXPECTED_BEFORE"
          test "${{ github.ref_name }}" = "update/144-pseudepigrapha-v0.2.0"
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_materializer_installation.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'PSEUDEPIGRAPHA_TF_COMMIT = "315439284e765c1d7ea89ffdefdd10f403aa1293"':
                  'PSEUDEPIGRAPHA_TF_COMMIT = "317e960e05ca7f36f35a11fcf567285312951095"',
              'self.assertEqual(plugin["version"], "0.1.0")':
                  'self.assertEqual(plugin["version"], "0.2.0")',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected occurrence count for {old!r}: {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/test_materializer_installation.py
      - name: Commit test-only GREEN change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_materializer_installation.py
          git commit -m "test: update Pseudepigrapha release identity"
          git push origin HEAD:update/144-pseudepigrapha-v0.2.0
