name: Patch parent runtime GREEN2 135

on:
  push:
    branches:
      - feat/materializer-parent-input-135-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[parent-green2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/materializer-parent-input-135-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply low-level parent runtime GREEN
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agora_materialize.py')
          text = path.read_text(encoding='utf-8')

          old = '''def _render_args(\n    args: list[str],\n    *,\n    source: str,\n    output: str,\n    source_revision: str = "",\n) -> list[str]:\n    values = {\n        "{source}": source,\n        "{output}": output,\n        "{source_revision}": source_revision,\n    }\n'''
          new = '''def _render_args(\n    args: list[str],\n    *,\n    source: str,\n    output: str,\n    source_revision: str = "",\n    parent: str | None = None,\n) -> list[str]:\n    values = {\n        "{source}": source,\n        "{output}": output,\n        "{source_revision}": source_revision,\n    }\n    if parent is not None:\n        values["{parent}"] = parent\n'''
          if text.count(old) != 1:
              raise SystemExit('render args insertion point not found exactly once')
          text = text.replace(old, new, 1)

          old = '''def _preflight_output(path: Path) -> Path:\n'''
          new = '''def _paths_overlap(left: Path, right: Path) -> bool:\n    left = left.resolve(strict=False)\n    right = right.resolve(strict=False)\n    return left == right or left in right.parents or right in left.parents\n\n\ndef _preflight_output(path: Path) -> Path:\n'''
          if text.count(old) != 1:
              raise SystemExit('output overlap helper insertion point not found exactly once')
          text = text.replace(old, new, 1)

          old = '''def materialize(\n    *,\n    manifest_path: Path,\n    materializer_id: str,\n    output: Path,\n    source: Path | None = None,\n    sandbox: str = "required",\n) -> Path:\n'''
          new = '''def materialize(\n    *,\n    manifest_path: Path,\n    materializer_id: str,\n    output: Path,\n    source: Path | None = None,\n    sandbox: str = "required",\n    parent: ParentResourceBinding | None = None,\n) -> Path:\n'''
          if text.count(old) != 1:
              raise SystemExit('materialize signature not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    spec = select_materializer(manifest, materializer_id)\n    plugin_root = manifest_path.parent\n\n    # Fail before acquisition/network side effects when the destination or sandbox is unusable.\n    final_output = _preflight_output(output)\n'''
          new = '''    spec = select_materializer(manifest, materializer_id)\n    plugin_root = manifest_path.parent\n\n    uses_parent = any("{parent}" in arg for arg in spec["execution"]["args"])\n    validated_parent: ParentResourceBinding | None = None\n    if parent is not None:\n        validated_parent = validate_parent_binding(spec, parent)\n    elif uses_parent:\n        raise ValueError("feature-module materializer requires a trusted parent binding")\n\n    if validated_parent is not None:\n        requested_output = Path(output).expanduser().resolve(strict=False)\n        if _paths_overlap(validated_parent.path, requested_output):\n            raise ValueError("parent resource path overlaps the writable output boundary")\n\n    # Fail before acquisition/network side effects when the destination or sandbox is unusable.\n    final_output = _preflight_output(output)\n'''
          if text.count(old) != 1:
              raise SystemExit('parent preflight insertion point not found exactly once')
          text = text.replace(old, new, 1)

          old = '''                *_render_args(\n                    execution["args"],\n                    source=str(prepared.path),\n                    output=str(staging.output),\n                    source_revision=source_revision,\n                ),\n'''
          new = '''                *_render_args(\n                    execution["args"],\n                    source=str(prepared.path),\n                    output=str(staging.output),\n                    source_revision=source_revision,\n                    parent=(\n                        str(validated_parent.path)\n                        if validated_parent is not None\n                        else None\n                    ),\n                ),\n'''
          if text.count(old) != 1:
              raise SystemExit('unsandboxed render call not found exactly once')
          text = text.replace(old, new, 1)

          old = '''        provenance = {\n            "schema_version": 1,\n            "plugin": {\n'''
          new = '''        provenance = {\n            "schema_version": 1,\n            "plugin": {\n'''
          if text.count(old) != 1:
              raise SystemExit('provenance object not found exactly once')

          old = '''            "created_at": datetime.now(timezone.utc).isoformat(),\n        }\n        _write_provenance(staging.output / "agora-materialization.json", provenance)\n'''
          new = '''            "created_at": datetime.now(timezone.utc).isoformat(),\n        }\n        if validated_parent is not None:\n            provenance["parent"] = {\n                "resource_id": validated_parent.resource_id,\n                "version": validated_parent.version,\n                "source_revision": validated_parent.source_revision,\n            }\n        _write_provenance(staging.output / "agora-materialization.json", provenance)\n'''
          if text.count(old) != 1:
              raise SystemExit('parent provenance insertion point not found exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Run focused GREEN2 contracts
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest tests.test_materializer_parent_input -v
      - name: Commit GREEN2 and remove patch runner
        shell: bash
        run: |
          rm .github/workflows/patch-parent-runtime-green2-135.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/agora_materialize.py .github/workflows/patch-parent-runtime-green2-135.yml
          git commit -m 'Execute with trusted parent bindings [parent-green2]'
          git push origin HEAD:feat/materializer-parent-input-135-v2
