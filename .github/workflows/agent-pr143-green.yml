name: Agent PR143 GREEN applicator

on:
  push:
    branches:
      - fix/context-fabric-git-maintenance-followup-142
    paths:
      - .github/workflows/agent-pr143-green.yml

permissions:
  contents: write

jobs:
  apply-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context-fabric-git-maintenance-followup-142
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply guarded production patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('plugins/context-fabric/src/agora_context_fabric/gitstore/__init__.py')
          text = path.read_text(encoding='utf-8')

          old = '    def _repository_maintenance(self) -> dict[str, Any]:\n'
          new = '    def _repository_maintenance(self, *, lock_timeout: float = 30.0) -> dict[str, Any]:\n'
          assert text.count(old) == 1, 'maintenance signature anchor drifted'
          text = text.replace(old, new, 1)

          old = '''            remaining = deadline - time.monotonic()\n            try:\n                with self._repository_lock(repo.name, timeout=remaining, shared=False):\n'''
          new = '''            remaining = deadline - time.monotonic()\n            repository_lock_timeout = min(max(0.0, float(lock_timeout)), remaining)\n            try:\n                with self._repository_lock(\n                    repo.name,\n                    timeout=repository_lock_timeout,\n                    shared=False,\n                ):\n'''
          assert text.count(old) == 1, 'repository lock anchor drifted'
          text = text.replace(old, new, 1)

          old = '''                    row["bytes_before"] = before_size\n                    row["before_measurement_complete"] = bool(before_size_complete)\n                    needs_maintenance = bool(\n'''
          new = '''                    row["bytes_before"] = before_size\n                    row["before_measurement_complete"] = bool(before_size_complete)\n                    if not before_size_complete and time.monotonic() >= deadline:\n                        budget_exhausted = True\n                    needs_maintenance = bool(\n'''
          assert text.count(old) == 1, 'pre-size budget anchor drifted'
          text = text.replace(old, new, 1)

          old = '''    def prune(self, *, target_bytes: int | None = None, timeout: float = 30.0) -> dict[str, Any]:\n        maintenance = self._repository_maintenance()\n'''
          new = '''    def prune(self, *, target_bytes: int | None = None, timeout: float = 30.0) -> dict[str, Any]:\n        maintenance = self._repository_maintenance(lock_timeout=timeout)\n'''
          assert text.count(old) == 1, 'prune forwarding anchor drifted'
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused maintenance regressions
        run: |
          python -m unittest discover -s tests -p 'test_context_fabric_git_maintenance_followup_142.py' -v
          python -m unittest discover -s tests -p 'test_context_fabric_git_maintenance_red3.py' -v
          python -m unittest discover -s tests -p 'test_context_fabric_git_metadata_maintenance.py' -v
          python -m unittest discover -s tests -p 'test_context_fabric_git_repository_lock_domain.py' -v
      - name: Commit GREEN and remove applicator
        run: |
          rm .github/workflows/agent-pr143-green.yml
          git config user.name 'Agora agent'
          git config user.email 'actions@users.noreply.github.com'
          git add plugins/context-fabric/src/agora_context_fabric/gitstore/__init__.py .github/workflows/agent-pr143-green.yml
          git commit -m 'Fix Git maintenance timeout and budget reporting'
          git push origin HEAD:fix/context-fabric-git-maintenance-followup-142
