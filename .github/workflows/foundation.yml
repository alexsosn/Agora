name: Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Repository foundation and registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required Phase 0 structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            LICENSE
            CONTRIBUTING.md
            wiki/research.md
            wiki/plan.md
            wiki/v0.1-scope.md
            wiki/greek-collections.md
            registry/README.md
            plugins/README.md
            profiles/README.md
            scripts/README.md
            tests/README.md
            generated/README.md
          )

          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required foundation file: $path" >&2
              exit 1
            fi
          done

      - name: Verify clean-slate policy is documented
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'mcp-demo' CONTRIBUTING.md
          grep -Fq 'not a compatibility target' CONTRIBUTING.md

      - name: Verify generated-artifact policy is documented
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'deterministic generator' generated/README.md
          grep -Fq 'CI freshness check' generated/README.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install registry validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate canonical registry
        run: python scripts/validate_registry.py

      - name: Run registry tests
        run: python -m unittest discover -s tests -v
