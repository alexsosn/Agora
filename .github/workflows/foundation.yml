name: Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Each PR head replaces earlier checks; every push/manual run keeps a unique run ID.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Fail-closed CI change scope
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.decide.outputs.validation }}
    steps:
      - name: Check out complete PR merge parents
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python for scope classifier
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Select conservative validation gate
        id: decide
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            scope="$(python scripts/ci_change_scope.py --git-classify)"
            if [[ "$scope" != "full" && "$scope" != "docs" ]]; then
              echo "Unexpected scope: $scope" >&2
              exit 1
            fi
          else
            # Main, scheduled and manually dispatched runs retain full CI.
            scope=full
          fi
          echo "validation=$scope" >> "$GITHUB_OUTPUT"
          echo "Foundation validation scope: $scope"

  foundation:
    name: Repository foundation, registry, and manifests
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Report-only scope diagnostics compare the synthetic PR merge commit
          # to its first parent; never use this report to skip CI jobs.
          fetch-depth: 2

      - name: Verify required project structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            LICENSE
            CONTRIBUTING.md
            wiki/README.md
            wiki/architecture/ref-marketplace-architecture.md
            wiki/architecture/ref-context-fabric-collections.md
            wiki/releases/v0.1-plan-active.md
            wiki/releases/v0.1-scope-frozen.md
            wiki/guides/installation.md
            registry/README.md
            registry/marketplace.yaml
            plugins/README.md
            plugins/context-fabric/resources/catalog.yaml
            profiles/README.md
            scripts/README.md
            tests/README.md
            generated/README.md
          )

          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required project file: $path" >&2
              exit 1
            fi
          done

      - name: Verify wiki organization convention
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t root_markdown < <(find wiki -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort)
          if [[ "${root_markdown[*]}" != "README.md" ]]; then
            echo "Only wiki/README.md may live directly under wiki/. Found: ${root_markdown[*]}" >&2
            exit 1
          fi

          while IFS= read -r path; do
            name="${path##*/}"
            if [[ ! "$name" =~ ^P[0-2]-(research|design|implement|verify|blocked)-[a-z0-9][a-z0-9-]*\.md$ ]]; then
              echo "Backlog filename violates priority/state convention: $path" >&2
              exit 1
            fi
          done < <(find wiki/backlog -maxdepth 1 -type f -name '*.md' | sort)

          while IFS= read -r path; do
            name="${path##*/}"
            if [[ ! "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-review-[a-z0-9][a-z0-9-]*\.md$ ]]; then
              echo "Review filename violates dated review convention: $path" >&2
              exit 1
            fi
          done < <(find wiki/reviews -maxdepth 1 -type f -name '*.md' | sort)

          while IFS= read -r path; do
            name="${path##*/}"
            if [[ ! "$name" =~ ^ref-[a-z0-9][a-z0-9-]*\.md$ ]]; then
              echo "Architecture filename violates ref-* convention: $path" >&2
              exit 1
            fi
          done < <(find wiki/architecture -maxdepth 1 -type f -name '*.md' | sort)

      - name: Verify clean-slate policy is documented
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'mcp-demo' CONTRIBUTING.md
          grep -Fq 'not a compatibility target' CONTRIBUTING.md

      - name: Verify generated-artifact policy is documented
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'deterministic generator' generated/README.md
          grep -Fq 'CI freshness check' generated/README.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Report PR change scope (non-gating)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python scripts/ci_change_scope.py --git-report

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'

      - name: Reject Python syntax errors before installing dependencies
        run: python -m compileall -q scripts tests plugins/context-fabric/src

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate canonical registry
        run: python scripts/validate_registry.py

      - name: Verify runtime dependency snapshots are fresh
        run: python scripts/check_runtime_environment_freshness.py

      - name: Verify generated marketplace artifacts are fresh
        run: python scripts/generate_marketplaces.py --check

      - name: Verify Context-Fabric runtime catalog is fresh
        run: python scripts/generate_context_fabric_catalog.py --check

      - name: Verify v0.1 release status is fresh
        run: python scripts/generate_release_status.py --check

      - name: Validate generated researcher documentation contract
        if: needs.scope.outputs.validation == 'docs'
        run: |
          python scripts/generate_plugin_docs.py --check
          python scripts/generate_resource_catalog_docs.py --check

      - name: Run bounded docs/first-contact unit tests
        if: needs.scope.outputs.validation == 'docs'
        shell: bash
        run: |
          set -euo pipefail
          for test_pattern in \
            test_human_scholarly_guidance_169.py \
            test_symptom_recovery_docs_172.py \
            test_first_success_tutorials_170.py \
            test_researcher_docs_integrity_173.py \
            test_compatibility_decisions_171.py \
            test_release_front_door.py \
            test_plugin_detail_docs.py \
            test_resource_catalog_docs.py \
            test_user_docs_landing.py \
            test_user_docs_mental_model.py; do
            python -m unittest discover -s tests -p "$test_pattern" -v
          done

      - name: Run unit tests
        if: needs.scope.outputs.validation == 'full'
        run: python -m unittest discover -s tests -v

  context-fabric-cache-lifecycle:
    name: Context-Fabric cache lifecycle (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.validation == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install cache lifecycle test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run cross-process cache lifecycle regressions
        run: python tests/test_context_fabric_cache_lifecycle.py

      - name: Run conservative cache discovery regressions
        run: python tests/test_context_fabric_cache_discovery.py

  materializer-install-locks:
    name: Materializer install locks (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.validation == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lock test dependencies
        run: python -m pip install -r requirements-dev.txt

      # Installation locking is per-OS behaviour, like the Context-Fabric cache
      # locks above: process-death release, bounded waiting, and mixed-version
      # migration semantics have to hold everywhere Agora installs.
      - name: Run installation lock regressions
        run: python -m unittest discover -s tests -p 'test_materializer_installation.py' -v

      - name: Run lock migration regressions
        run: python -m unittest discover -s tests -p 'test_materializer_lock_migration.py' -v
