name: Temporary PR110 GREEN3d applicator

on:
  push:
    branches:
      - feat/context-fabric-git-maintenance-45
    paths:
      - .github/workflows/tmp-pr110-green3d.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply minimal measurement-truthfulness fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('plugins/context-fabric/src/agora_context_fabric/gitstore/__init__.py')
          text = path.read_text(encoding='utf-8')

          old_skipped = '''                    if not needs_maintenance:\n                        row["maintenance_status"] = "skipped"\n                        row["after_measurement_complete"] = True\n                        row["bytes_after"] = before_size\n                        row["bytes_reclaimed"] = 0\n                        row["garbage_entries_after"] = before_git["garbage"]\n                        row["garbage_entries_removed"] = 0\n                        row["packs_after"] = before_git["packs"]\n                        rows.append(row)\n                        continue\n'''
          new_skipped = '''                    if not needs_maintenance:\n                        # No mutation occurred, so the maintenance effect is exactly zero,\n                        # but no post-maintenance observation was performed. Keep row-level\n                        # after fields unset instead of presenting copied pre-state as measured.\n                        row["maintenance_status"] = "skipped"\n                        rows.append(row)\n                        continue\n'''
          if text.count(old_skipped) != 1:
              raise SystemExit('expected skipped-maintenance block not found exactly once')
          text = text.replace(old_skipped, new_skipped)

          old_aggregate = '''        reclamation_complete = all(\n            row["maintenance_status"] == "skipped"\n            or (\n                row["maintenance_status"] == "success"\n                and bool(row["before_measurement_complete"])\n                and bool(row["after_measurement_complete"])\n            )\n            for row in rows\n        )\n        bytes_reclaimed = (\n            sum(int(row["bytes_reclaimed"]) for row in rows)\n            if reclamation_complete\n            else None\n        )\n        garbage_removed = (\n            sum(int(row["garbage_entries_removed"]) for row in rows)\n            if reclamation_complete\n            else None\n        )\n        packs_before = (\n            sum(int(row["packs_before"]) for row in rows)\n            if all(row["packs_before"] is not None for row in rows)\n            else None\n        )\n        packs_after = (\n            sum(int(row["packs_after"]) for row in rows)\n            if all(row["packs_after"] is not None for row in rows)\n            else None\n        )\n'''
          new_aggregate = '''        reclamation_complete = all(\n            row["maintenance_status"] == "skipped"\n            or (\n                row["maintenance_status"] == "success"\n                and bool(row["before_measurement_complete"])\n                and bool(row["after_measurement_complete"])\n            )\n            for row in rows\n        )\n        bytes_reclaimed = (\n            sum(\n                0 if row["maintenance_status"] == "skipped" else int(row["bytes_reclaimed"])\n                for row in rows\n            )\n            if reclamation_complete\n            else None\n        )\n        git_reclamation_complete = all(\n            row["maintenance_status"] == "skipped"\n            or (\n                row["maintenance_status"] == "success"\n                and row["garbage_entries_before"] is not None\n                and row["garbage_entries_after"] is not None\n                and row["packs_before"] is not None\n                and row["packs_after"] is not None\n            )\n            for row in rows\n        )\n        garbage_removed = (\n            sum(\n                0\n                if row["maintenance_status"] == "skipped"\n                else int(row["garbage_entries_removed"])\n                for row in rows\n            )\n            if git_reclamation_complete\n            else None\n        )\n        packs_before = (\n            sum(int(row["packs_before"]) for row in rows)\n            if all(row["packs_before"] is not None for row in rows)\n            else None\n        )\n        packs_after = (\n            sum(\n                int(row["packs_before"])\n                if row["maintenance_status"] == "skipped"\n                else int(row["packs_after"])\n                for row in rows\n            )\n            if git_reclamation_complete\n            else None\n        )\n'''
          if text.count(old_aggregate) != 1:
              raise SystemExit('expected reclamation aggregate block not found exactly once')
          text = text.replace(old_aggregate, new_aggregate)

          old_return = '''            "repository_reclamation_complete": reclamation_complete,\n            "repository_bytes_reclaimed": bytes_reclaimed,\n            "repository_garbage_entries_removed": garbage_removed,\n'''
          new_return = '''            "repository_reclamation_complete": reclamation_complete,\n            "repository_bytes_reclaimed": bytes_reclaimed,\n            "repository_git_reclamation_complete": git_reclamation_complete,\n            "repository_garbage_entries_removed": garbage_removed,\n'''
          if text.count(old_return) != 1:
              raise SystemExit('expected reclamation return block not found exactly once')
          text = text.replace(old_return, new_return)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused RED3/review suites
        env:
          PYTHONPATH: plugins/context-fabric/src:tests
        run: |
          python -m unittest -v \
            test_context_fabric_git_maintenance_red3 \
            test_context_fabric_git_maintenance_review
      - name: Commit GREEN and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/tmp-pr110-red3d-windows.yml .github/workflows/tmp-pr110-green3d.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/context-fabric/src/agora_context_fabric/gitstore/__init__.py .github/workflows
          git commit -m 'GREEN3d: separate Git and byte reclamation truthfulness'
          git push origin HEAD:feat/context-fabric-git-maintenance-45
