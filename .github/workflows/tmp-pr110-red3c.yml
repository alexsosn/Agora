name: Temporary PR110 RED3c proof

on:
  push:
    branches:
      - feat/context-fabric-git-maintenance-45
    paths:
      - .github/workflows/tmp-pr110-red3c.yml

permissions:
  contents: read

jobs:
  red3c:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-fabric-git-maintenance-45
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prove skipped maintenance byte-completeness RED
        env:
          PYTHONPATH: tests
        run: |
          python -m unittest -v \
            test_context_fabric_git_maintenance_review.GitMaintenanceMeasurementIndependenceReviewTests.test_skipped_healthy_repo_does_not_invent_complete_byte_measurement
