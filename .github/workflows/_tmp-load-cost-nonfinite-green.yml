name: Temporary load-cost non-finite GREEN

on:
  push:
    branches: [feat/resource-load-cost-38]
    paths:
      - '.github/workflows/_tmp-load-cost-nonfinite-green.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resource-load-cost-38
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Reject non-finite YAML numbers before JSON Schema validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_registry.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'import json\nimport sys\n'
          new_import = 'import json\nimport math\nimport sys\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'import marker count: {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old = '''def schema_errors(instance: Any, schema_path: Path, label: str) -> list[str]:
              schema = load_json(schema_path)
              validator = Draft202012Validator(schema, format_checker=FormatChecker())
              errors: list[str] = []
              for error in sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path)):
                  path = ".".join(str(part) for part in error.absolute_path)
                  where = f"{label}:{path}" if path else label
                  errors.append(f"{where}: {error.message}")
              return errors
          '''
          new = '''def _non_finite_json_number_errors(value: Any, label: str, path: tuple[Any, ...] = ()) -> list[str]:
              errors: list[str] = []
              if isinstance(value, float) and not math.isfinite(value):
                  rendered_path = ".".join(str(part) for part in path)
                  where = f"{label}:{rendered_path}" if rendered_path else label
                  errors.append(f"{where}: non-finite number {value!r} is not valid JSON")
                  return errors
              if isinstance(value, dict):
                  for key, child in value.items():
                      errors.extend(_non_finite_json_number_errors(child, label, (*path, key)))
              elif isinstance(value, (list, tuple)):
                  for index, child in enumerate(value):
                      errors.extend(_non_finite_json_number_errors(child, label, (*path, index)))
              return errors


          def schema_errors(instance: Any, schema_path: Path, label: str) -> list[str]:
              schema = load_json(schema_path)
              validator = Draft202012Validator(schema, format_checker=FormatChecker())
              errors = _non_finite_json_number_errors(instance, label)
              for error in sorted(validator.iter_errors(instance), key=lambda e: list(e.absolute_path)):
                  path = ".".join(str(part) for part in error.absolute_path)
                  where = f"{label}:{path}" if path else label
                  errors.append(f"{where}: {error.message}")
              return errors
          '''
          if text.count(old) != 1:
              raise SystemExit(f'schema_errors marker count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_resource_load_cost_nonfinite_review.py' -v
          python -m unittest discover -s tests -p 'test_resource_load_cost*.py' -v
          python scripts/validate_registry.py
      - name: Commit GREEN and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-load-cost-nonfinite-green.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_registry.py .github/workflows/_tmp-load-cost-nonfinite-green.yml
          git commit -m 'fix: reject non-finite registry numbers'
          git push origin HEAD:feat/resource-load-cost-38
