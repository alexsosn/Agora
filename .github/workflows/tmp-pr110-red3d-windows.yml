name: Temporary PR110 RED3d Windows proof

on:
  push:
    branches:
      - feat/context-fabric-git-maintenance-45
    paths:
      - .github/workflows/tmp-pr110-red3d-windows.yml

permissions:
  contents: read

jobs:
  red3d:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-fabric-git-maintenance-45
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prove independent byte/Git measurement RED
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'tests'
          python -m unittest -v test_context_fabric_git_maintenance_review
