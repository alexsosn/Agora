name: Apply load-cost GREEN

on:
  push:
    branches: [feat/resource-load-cost-38]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-load-cost-green]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/resource-load-cost-38
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply guarded production transformations
        run: |
          python scripts/_apply_load_cost_green.py
          python scripts/_refine_load_cost_schema.py

      - name: Regenerate bundled Context-Fabric catalog
        run: python scripts/generate_context_fabric_catalog.py

      - name: Validate canonical registry
        run: python scripts/validate_registry.py

      - name: Run focused load-cost contract
        run: |
          python -m unittest tests.test_resource_load_cost tests.test_resource_load_cost_feature_module_red -v

      - name: Verify generated catalog freshness
        run: python scripts/generate_context_fabric_catalog.py --check

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit GREEN only after focused validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agora agent"
          git config user.email "actions@users.noreply.github.com"
          git add \
            registry/schema/resources.schema.json \
            scripts/validate_registry.py \
            plugins/context-fabric/src/agora_context_fabric/catalog.py \
            plugins/context-fabric/src/agora_context_fabric/service.py \
            registry/resources.yaml \
            plugins/context-fabric/resources/catalog.yaml
          if git diff --cached --quiet; then
            echo "No production changes were produced" >&2
            exit 1
          fi
          git commit -m "feat: expose measured resource load costs"
          git push origin HEAD:feat/resource-load-cost-38
