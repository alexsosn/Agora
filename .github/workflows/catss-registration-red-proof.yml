name: CATSS registry test-only RED (do not merge)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure registry contract dependencies
        run: python -m pip install PyYAML jsonschema portalocker
      - name: RED-only missing registered CATSS producer (must fail)
        run: python -m unittest tests.test_catss_canonical_registered_221 -v
