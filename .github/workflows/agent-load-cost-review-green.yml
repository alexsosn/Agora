name: Load-cost review GREEN

on:
  push:
    branches: [feat/resource-load-cost-38]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[load-cost-review-green]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resource-load-cost-38
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Rebase onto current main
        run: |
          git config user.name "Agora agent"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Apply review revisions with minimal schema diff
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          schema_path = root / 'registry/schema/resources.schema.json'
          base = subprocess.check_output(
              ['git', 'show', 'origin/main:registry/schema/resources.schema.json'],
              text=True,
          )

          measurement = {
              'type': 'object',
              'additionalProperties': False,
              'required': ['checked_at', 'agora_revision', 'environment', 'evidence'],
              'properties': {
                  'checked_at': {'type': 'string', 'format': 'date'},
                  'agora_revision': {'type': 'string', 'pattern': '^[0-9a-f]{40}$'},
                  'environment': {'type': 'string', 'minLength': 1},
                  'evidence': {'type': 'string', 'format': 'uri', 'pattern': r'^https?://\S+$'},
              },
          }
          nonnegative_range = {
              'type': 'object',
              'additionalProperties': False,
              'required': ['min', 'max'],
              'properties': {
                  'min': {'type': 'number', 'minimum': 0},
                  'max': {'type': 'number', 'minimum': 0},
              },
          }
          resource_fields = [
              'source_size_mb', 'compiled_size_mb', 'total_cache_mb',
              'peak_rss_mb', 'first_load_seconds', 'warm_load_seconds',
          ]
          member_fields = [
              'typical_member_cache_mb', 'typical_member_first_load_seconds',
              'discovery_seconds', 'discovery_cache_mb',
          ]
          resource_cost = {
              'type': 'object',
              'additionalProperties': False,
              'required': ['scope', 'measurement'],
              'properties': {
                  'scope': {'const': 'resource'},
                  **{name: {'type': 'number', 'minimum': 0} for name in resource_fields},
                  'measurement': {'$ref': '#/$defs/loadCostMeasurement'},
                  'notes': {'type': 'string', 'minLength': 1},
              },
              'anyOf': [{'required': [name]} for name in resource_fields],
          }
          member_cost = {
              'type': 'object',
              'additionalProperties': False,
              'required': ['scope', 'measurement'],
              'properties': {
                  'scope': {'const': 'collection-member'},
                  'typical_member_cache_mb': {'type': 'number', 'minimum': 0},
                  'typical_member_first_load_seconds': {'$ref': '#/$defs/nonNegativeRange'},
                  'discovery_seconds': {'type': 'number', 'minimum': 0},
                  'discovery_cache_mb': {'type': 'number', 'minimum': 0},
                  'measurement': {'$ref': '#/$defs/loadCostMeasurement'},
                  'notes': {'type': 'string', 'minLength': 1},
              },
              'anyOf': [{'required': [name]} for name in member_fields],
          }
          defs = {
              'loadCostMeasurement': measurement,
              'nonNegativeRange': nonnegative_range,
              'resourceLoadCost': resource_cost,
              'collectionMemberLoadCost': member_cost,
              'loadCost': {
                  'if': {'properties': {'scope': {'const': 'resource'}}, 'required': ['scope']},
                  'then': {'$ref': '#/$defs/resourceLoadCost'},
                  'else': {'$ref': '#/$defs/collectionMemberLoadCost'},
              },
          }
          rendered = json.dumps(defs, indent=2, ensure_ascii=False)
          defs_block = '  "$defs": ' + rendered.replace('\n', '\n  ') + ',\n'
          id_anchor = '  "$id": "https://github.com/alexsosn/Agora/registry/schema/resources.schema.json",\n'
          if base.count(id_anchor) != 1:
              raise SystemExit('schema $id anchor drifted')
          text = base.replace(id_anchor, id_anchor + defs_block, 1)
          prop_anchor = '          "description": {"type": "string", "minLength": 1},\n'
          if text.count(prop_anchor) != 1:
              raise SystemExit('schema description anchor drifted')
          text = text.replace(prop_anchor, prop_anchor + '          "load_cost": {"$ref": "#/$defs/loadCost"},\n', 1)
          feature_anchor = '            "then": {"required": ["parent", "compatibility", "module"]},\n'
          feature_replacement = (
              '            "then": {\n'
              '              "allOf": [\n'
              '                {"required": ["parent", "compatibility", "module"]},\n'
              '                {"not": {"required": ["load_cost"]}}\n'
              '              ]\n'
              '            },\n'
          )
          if text.count(feature_anchor) != 1:
              raise SystemExit('feature-module schema anchor drifted')
          text = text.replace(feature_anchor, feature_replacement, 1)
          json.loads(text)
          schema_path.write_text(text, encoding='utf-8')

          resources_path = root / 'registry/resources.yaml'
          resources = resources_path.read_text(encoding='utf-8')
          notes = {
              'bhsa': 'Historical machine-specific observation; current-machine cost may differ. Parent-only measurement excludes module combinations and may trigger separate overlay compilation tracked in #46.',
              'cuc': 'Historical machine-specific observation; current-machine cost may differ.',
              'TLHdig-TF': 'Historical machine-specific observation; current-machine cost may differ. Peak RSS came from the related earlier run rather than the final converged compile measurement.',
              'greek_literature': 'Historical machine-specific observation; current-machine cost may differ.',
          }
          for resource_id, note in notes.items():
              marker = f'- id: {resource_id}\n'
              start = resources.find(marker)
              if start < 0:
                  raise SystemExit(f'missing resource {resource_id}')
              next_start = resources.find('\n- id: ', start + len(marker))
              end = len(resources) if next_start < 0 else next_start + 1
              block = resources[start:end]
              if '  load_cost:\n' not in block:
                  raise SystemExit(f'missing load_cost for {resource_id}')
              source_anchor = '  source_snapshot:'
              pos = block.find(source_anchor)
              if pos < 0:
                  raise SystemExit(f'missing source_snapshot for {resource_id}')
              before = block[:pos]
              after = block[pos:]
              lines = before.splitlines(keepends=True)
              note_indexes = [i for i, line in enumerate(lines) if line.startswith('    notes:')]
              if note_indexes:
                  if len(note_indexes) != 1:
                      raise SystemExit(f'ambiguous load_cost notes for {resource_id}')
                  i = note_indexes[0]
                  lines[i] = f'    notes: "{note}"\n'
              else:
                  lines.append(f'    notes: "{note}"\n')
              new_block = ''.join(lines) + after
              resources = resources[:start] + new_block + resources[end:]
          resources_path.write_text(resources, encoding='utf-8')
          PY

      - name: Remove temporary review workflows
        run: |
          rm -f .github/workflows/agent-load-cost-review-red.yml
          rm -f .github/workflows/agent-load-cost-review-green.yml

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Regenerate bundled catalog
        run: python scripts/generate_context_fabric_catalog.py

      - name: Validate GREEN
        run: |
          python scripts/validate_registry.py
          python -m unittest tests.test_resource_load_cost tests.test_resource_load_cost_feature_module_red tests.test_resource_load_cost_review_regressions -v
          python scripts/generate_context_fabric_catalog.py --check
          git diff --check

      - name: Commit reviewed GREEN
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "Agora agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: qualify historical load-cost measurements"
          git push --force-with-lease=refs/heads/feat/resource-load-cost-38:${EXPECTED_REMOTE_HEAD} origin HEAD:refs/heads/feat/resource-load-cost-38
