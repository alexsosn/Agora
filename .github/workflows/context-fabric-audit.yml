name: Context-Fabric source audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
    paths:
      - '.github/workflows/context-fabric-audit.yml'
      - 'registry/resources.yaml'
      - 'registry/feature-modules.yaml'
      - 'scripts/audit_context_fabric_sources.py'
      - 'scripts/smoke_context_fabric_feature_modules.py'
      - 'plugins/context-fabric/resources/catalog.yaml'
      - 'plugins/context-fabric/resources/feature-modules.yaml'
      - 'plugins/context-fabric/src/agora_context_fabric/catalog.py'
      - 'plugins/context-fabric/src/agora_context_fabric/gitstore.py'
      - 'plugins/context-fabric/src/agora_context_fabric/resolver.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/context-fabric-audit.yml'
      - 'registry/resources.yaml'
      - 'registry/feature-modules.yaml'
      - 'scripts/audit_context_fabric_sources.py'
      - 'scripts/smoke_context_fabric_feature_modules.py'
      - 'plugins/context-fabric/resources/catalog.yaml'
      - 'plugins/context-fabric/resources/feature-modules.yaml'
      - 'plugins/context-fabric/src/agora_context_fabric/catalog.py'
      - 'plugins/context-fabric/src/agora_context_fabric/gitstore.py'
      - 'plugins/context-fabric/src/agora_context_fabric/resolver.py'

permissions:
  contents: read

jobs:
  audit:
    name: Audit registered Context-Fabric upstreams
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Agora
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install audit dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit repository metadata and module compatibility
        run: |
          python scripts/audit_context_fabric_sources.py \
            --cache-dir "${RUNNER_TEMP}/agora-context-fabric-audit" \
            --output context-fabric-audit.json

      - name: Install Context-Fabric runtime for required load smokes
        run: python -m pip install -e plugins/context-fabric

      - name: Real-load standalone modules lacking core metadata
        run: |
          python scripts/smoke_context_fabric_feature_modules.py \
            --audit-report context-fabric-audit.json \
            --cache-dir "${RUNNER_TEMP}/agora-context-fabric-audit" \
            --output context-fabric-feature-module-smoke.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-fabric-audit
          path: |
            context-fabric-audit.json
            context-fabric-feature-module-smoke.json
          if-no-files-found: warn
