name: Context-Fabric source audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/context-fabric-audit.yml'
      - 'scripts/audit_context_fabric_sources.py'
      - 'plugins/context-fabric/resources/catalog.yaml'
      - 'plugins/context-fabric/resources/feature-modules.yaml'

permissions:
  contents: read

jobs:
  audit:
    name: Audit registered Context-Fabric upstreams
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Agora
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install audit dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit repository metadata
        run: |
          python scripts/audit_context_fabric_sources.py \
            --cache-dir "${RUNNER_TEMP}/agora-context-fabric-audit" \
            --output context-fabric-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-fabric-audit
          path: context-fabric-audit.json
          if-no-files-found: warn
