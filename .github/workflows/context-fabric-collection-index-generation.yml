name: Context-Fabric collection index generation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "registry/collections/**"
      - "registry/resources.yaml"
      - "plugins/context-fabric/src/agora_context_fabric/collection_index.py"
      - "plugins/context-fabric/src/agora_context_fabric/gitstore.py"
      - "scripts/generate_context_fabric_collection_indexes.py"
      - ".github/workflows/context-fabric-collection-index-generation.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resource:
          - bible
          - patristics
          - greek_literature
          - translatin-manif
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install generation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate commit-bound collection index
        run: >-
          python scripts/generate_context_fabric_collection_indexes.py
          --resource "${{ matrix.resource }}"
          --output-dir generated-collection-indexes
          --cache-dir "$RUNNER_TEMP/agora-context-fabric-index-cache"

      - name: Verify canonical collection index is fresh
        run: >-
          python scripts/generate_context_fabric_collection_indexes.py
          --resource "${{ matrix.resource }}"
          --check
          --cache-dir "$RUNNER_TEMP/agora-context-fabric-index-cache"

      - name: Upload generated index
        uses: actions/upload-artifact@v4
        with:
          name: context-fabric-collection-index-${{ matrix.resource }}
          path: generated-collection-indexes/${{ matrix.resource }}.yaml
          if-no-files-found: error
          retention-days: 7

  patch-review-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/13-commit-bound-collection-indexes' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/13-commit-bound-collection-indexes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply Python review fixes if needed
        shell: python
        run: |
          from pathlib import Path

          gitstore_path = Path("plugins/context-fabric/src/agora_context_fabric/gitstore.py")
          gitstore = gitstore_path.read_text(encoding="utf-8")
          if "    def tf_header_metadata(\n" not in gitstore:
              insertion = "    def tf_feature_summary(\n"
              method_lines = [
                  "    def tf_header_metadata(",
                  "        self,",
                  "        repo: Path,",
                  "        relative_path: str,",
                  "        revision: str | None = None,",
                  "    ) -> dict[str, Any]:",
                  "        \"\"\"Read Text-Fabric metadata header fields without consuming feature rows.\"\"\"",
                  "        relative = self._safe_relative_path(relative_path)",
                  "        treeish = self._treeish(repo, revision)",
                  "        spec = f\"{treeish}:{relative}\"",
                  "        command = [\"git\", \"-C\", str(repo), \"show\", spec]",
                  "        process = subprocess.Popen(",
                  "            command,",
                  "            text=True,",
                  "            stdout=subprocess.PIPE,",
                  "            stderr=subprocess.PIPE,",
                  "        )",
                  "        assert process.stdout is not None",
                  "        metadata: dict[str, Any] = {}",
                  "        header_complete = False",
                  "        try:",
                  "            for raw_line in process.stdout:",
                  "                line = raw_line.rstrip(\"\\r\\n\")",
                  "                if not line or not line.startswith(\"@\"):",
                  "                    header_complete = True",
                  "                    break",
                  "                if \"=\" in line:",
                  "                    key, value = line[1:].split(\"=\", 1)",
                  "                    if key:",
                  "                        metadata[key] = value",
                  "        finally:",
                  "            process.stdout.close()",
                  "            stderr = process.stderr.read() if process.stderr is not None else \"\"",
                  "            returncode = process.wait()",
                  "            if process.stderr is not None:",
                  "                process.stderr.close()",
                  "            if returncode and not header_complete:",
                  "                raise subprocess.CalledProcessError(",
                  "                    returncode,",
                  "                    command,",
                  "                    stderr=stderr,",
                  "                )",
                  "        return metadata",
                  "",
                  "",
              ]
              if insertion not in gitstore:
                  raise SystemExit("tf_feature_summary insertion point not found")
              gitstore_path.write_text(
                  gitstore.replace(insertion, "\n".join(method_lines) + insertion, 1),
                  encoding="utf-8",
              )

          index_path = Path("plugins/context-fabric/src/agora_context_fabric/collection_index.py")
          index_text = index_path.read_text(encoding="utf-8")
          old_call = "            summary = self.store.tf_feature_summary(repo, relative, revision)\n"
          new_call = "            metadata = self.store.tf_header_metadata(repo, relative, revision)\n"
          old_extract = "        metadata = summary.get(\"metadata\") or {}\n"
          if old_call in index_text:
              if old_extract not in index_text:
                  raise SystemExit("collection metadata extraction marker missing")
              index_text = index_text.replace(old_call, new_call, 1).replace(old_extract, "", 1)
              index_path.write_text(index_text, encoding="utf-8")
          elif new_call not in index_text:
              raise SystemExit("collection metadata call not in recognized state")

      - name: Run focused review regressions
        run: |
          python -m unittest tests.test_context_fabric_collection_index_review_regressions -v
          python -m unittest tests.test_context_fabric_collection_index tests.test_context_fabric_collection_index_runtime -v

      - name: Commit Python review fixes when needed
        run: |
          if git diff --quiet -- plugins/context-fabric/src/agora_context_fabric/gitstore.py plugins/context-fabric/src/agora_context_fabric/collection_index.py; then
            echo "Python review fixes already present."
            exit 0
          fi
          git config user.name "Agora CI"
          git config user.email "actions@users.noreply.github.com"
          git add plugins/context-fabric/src/agora_context_fabric/gitstore.py plugins/context-fabric/src/agora_context_fabric/collection_index.py
          git commit -m "fix: make collection metadata reads header-only"
          git push origin HEAD:feat/13-commit-bound-collection-indexes
