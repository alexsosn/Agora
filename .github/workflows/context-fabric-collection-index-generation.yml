name: Context-Fabric collection index generation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "registry/collections/**"
      - "registry/resources.yaml"
      - "plugins/context-fabric/resources/catalog.yaml"
      - "plugins/context-fabric/src/agora_context_fabric/collection_index.py"
      - "plugins/context-fabric/src/agora_context_fabric/gitstore.py"
      - "scripts/generate_context_fabric_collection_indexes.py"
      - ".github/workflows/context-fabric-collection-index-generation.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resource:
          - bible
          - patristics
          - greek_literature
          - translatin-manif
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install generation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate commit-bound collection index
        run: >-
          python scripts/generate_context_fabric_collection_indexes.py
          --resource "${{ matrix.resource }}"
          --output-dir generated-collection-indexes
          --cache-dir "$RUNNER_TEMP/agora-context-fabric-index-cache"

      - name: Upload generated index
        uses: actions/upload-artifact@v4
        with:
          name: context-fabric-collection-index-${{ matrix.resource }}
          path: generated-collection-indexes/${{ matrix.resource }}.yaml
          if-no-files-found: error
          retention-days: 7

  render-indexed-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render exact four-collection discovery promotion
        shell: python
        run: |
          from pathlib import Path

          source = Path("registry/resources.yaml")
          text = source.read_text(encoding="utf-8")
          marker = "      discovery: git-tree\n"
          indexed = "      discovery: indexed\n"
          git_tree_count = text.count(marker)
          indexed_count = text.count(indexed)
          if (git_tree_count, indexed_count) == (4, 0):
              text = text.replace(marker, indexed)
          elif (git_tree_count, indexed_count) != (0, 4):
              raise SystemExit(
                  "expected exactly four collection discovery modes in either git-tree or indexed state; "
                  f"found git-tree={git_tree_count}, indexed={indexed_count}"
              )

          output = Path("generated-indexed-catalog")
          output.mkdir()
          (output / "resources.yaml").write_text(text, encoding="utf-8")
          (output / "catalog.yaml").write_text(text, encoding="utf-8")

      - name: Upload indexed catalog promotion preview
        uses: actions/upload-artifact@v4
        with:
          name: context-fabric-indexed-catalog
          path: generated-indexed-catalog/*.yaml
          if-no-files-found: error
          retention-days: 7

  promote-feature-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/13-commit-bound-collection-indexes' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [generate, render-indexed-catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/13-commit-bound-collection-indexes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download generated collection indexes
        uses: actions/download-artifact@v4
        with:
          pattern: context-fabric-collection-index-*
          path: generated-collection-indexes
          merge-multiple: true

      - name: Download indexed catalog preview
        uses: actions/download-artifact@v4
        with:
          name: context-fabric-indexed-catalog
          path: generated-indexed-catalog

      - name: Validate and install exact-revision artifacts
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import yaml

          expected = {
              "bible": "f09ea5060761b372adf1ac1d70d7b96918f57757",
              "patristics": "75d0e305c4f88a9304a4cf524dc19b9a66b0ec9e",
              "greek_literature": "77d85bf71fc6f689f7faedc255666a2609ffe590",
              "translatin-manif": "ab4df0d84d3480cee0cdaa41973c77ec7a0f99ed",
          }
          source_dir = Path("generated-collection-indexes")
          for resource_id, revision in expected.items():
              source = source_dir / f"{resource_id}.yaml"
              document = yaml.safe_load(source.read_text(encoding="utf-8"))
              assert document["collection_id"] == resource_id
              assert document["source_revision"] == revision
              assert document["index_status"] == "complete"
              members = document["members"]
              assert members
              assert len({member["id"] for member in members}) == len(members)
              assert len({member["path"] for member in members}) == len(members)
              for destination in (
                  Path("registry/collections") / source.name,
                  Path("plugins/context-fabric/resources/collections") / source.name,
              ):
                  shutil.copyfile(source, destination)

          resources = Path("generated-indexed-catalog/resources.yaml").read_text(encoding="utf-8")
          catalog = Path("generated-indexed-catalog/catalog.yaml").read_text(encoding="utf-8")
          assert resources == catalog
          Path("registry/resources.yaml").write_text(resources, encoding="utf-8")
          Path("plugins/context-fabric/resources/catalog.yaml").write_text(catalog, encoding="utf-8")

      - name: Validate promoted registry and generated copies
        run: |
          python scripts/validate_registry.py
          python scripts/generate_context_fabric_catalog.py --check

      - name: Commit promotion when needed
        run: |
          if git diff --quiet; then
            echo "Collection indexes already promoted; no commit needed."
            exit 0
          fi
          git config user.name "Agora CI"
          git config user.email "actions@users.noreply.github.com"
          git add registry/resources.yaml registry/collections plugins/context-fabric/resources/catalog.yaml plugins/context-fabric/resources/collections
          git commit -m "chore: promote exact-revision collection indexes"
          git push origin HEAD:feat/13-commit-bound-collection-indexes
