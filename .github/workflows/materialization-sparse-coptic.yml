name: Coptic pinned sparse Git acquisition

on:
  pull_request:
    paths:
      - '.github/workflows/materialization-sparse-coptic.yml'
      - 'scripts/agora_materialize.py'
      - 'registry/schema/materializer-plugin.schema.json'
      - 'tests/test_materialization_sparse_git.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialization-sparse-coptic.yml'
      - 'scripts/agora_materialize.py'
      - 'registry/schema/materializer-plugin.schema.json'
      - 'tests/test_materialization_sparse_git.py'
  workflow_dispatch:

permissions:
  contents: read

# Each PR head replaces earlier checks; every push/manual run keeps a unique run ID.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sparse-tt-git:
    name: Pinned TT source checkout and complete Git-tree inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Agora head without persisting GitHub credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install manifest validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Acquire all and only pinned TT payload blobs
        env:
          AGORA_GIT_PHASE_TIMINGS: "1"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          from scripts.agora_materialize import acquire_git_source
          from scripts.sparse_git_inventory import verify_selected_sparse_inventory

          revision = "3ac067f1709a0012daf39ea8da2fac79980176a5"
          strategy = {
              "type": "git",
              "url": "https://github.com/CopticScriptorium/corpora.git",
              "ref": revision,
              "subpath": ".",
              "sparse_patterns": ["/*/*_TT/**", "/*/*_TT.zip"],
          }
          materializer = {
              "input": {
                  "type": "directory",
                  "required_globs": ["*/*_TT*"],
                  "allow_symlinks": False,
              },
          }
          acquisition_started = time.monotonic()
          prepared = acquire_git_source(strategy, materializer)
          try:
              acquisition_elapsed_seconds = time.monotonic() - acquisition_started
              git_pack = prepared.path / ".git" / "objects" / "pack"
              git_pack_bytes = sum(p.stat().st_size for p in git_pack.glob("*") if p.is_file())
              scratch_disk_bytes = sum(
                  p.stat().st_size for p in prepared.cleanup_root.rglob("*")
                  if p.is_file() and not p.is_symlink()
              )
              print(
                  f"OBSERVED local acquisition_elapsed_seconds={acquisition_elapsed_seconds:.3f} "
                  f"git_pack_bytes={git_pack_bytes} scratch_disk_bytes={scratch_disk_bytes} "
                  "(post-acquisition disk state; not measured transfer bytes or peak disk)",
                  flush=True,
              )
              assert prepared.provenance["requested_ref"] == revision
              assert prepared.provenance["resolved_commit"] == revision
              assert prepared.provenance["sparse_patterns"] == strategy["sparse_patterns"]
              # Metadata-only git ls-tree -r -z HEAD (never --long):
              # checking all Git blob sizes lazily hydrated excluded data.
              # The helper verifies every selected Git blob against local bytes
              # with GIT_NO_LAZY_FETCH=1, preserving true partial-clone semantics.
              verification_started = time.monotonic()
              count, total = verify_selected_sparse_inventory(
                  prepared.path, expected_count=565, expected_bytes=220289125,
              )
              inventory_elapsed_seconds = time.monotonic() - verification_started
              print(
                  f"OBSERVED inventory_elapsed_seconds={inventory_elapsed_seconds:.3f} "
                  "(metadata-only tree + local Git blob hashes; no lazy fetch)",
                  flush=True,
              )
              print(f"PASS: {count} exact TT blob files, {total} bytes, pinned {revision}")
          finally:
              prepared.cleanup()
          PY
