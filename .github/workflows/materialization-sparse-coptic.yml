name: Coptic pinned sparse Git acquisition

on:
  pull_request:
    paths:
      - '.github/workflows/materialization-sparse-coptic.yml'
      - 'scripts/agora_materialize.py'
      - 'registry/schema/materializer-plugin.schema.json'
      - 'tests/test_materialization_sparse_git.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialization-sparse-coptic.yml'
      - 'scripts/agora_materialize.py'
      - 'registry/schema/materializer-plugin.schema.json'
      - 'tests/test_materialization_sparse_git.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sparse-tt-git:
    name: Pinned TT source checkout and complete Git-tree inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Agora head without persisting GitHub credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install manifest validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Acquire all and only pinned TT payload blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          from scripts.agora_materialize import acquire_git_source

          revision = "3ac067f1709a0012daf39ea8da2fac79980176a5"
          strategy = {
              "type": "git",
              "url": "https://github.com/CopticScriptorium/corpora.git",
              "ref": revision,
              "subpath": ".",
              "sparse_patterns": ["/*/*_TT/**", "/*/*_TT.zip"],
          }
          materializer = {
              "input": {
                  "type": "directory",
                  "required_globs": ["*/*_TT*"],
                  "allow_symlinks": False,
              },
          }
          prepared = acquire_git_source(strategy, materializer)
          try:
              assert prepared.provenance["requested_ref"] == revision
              assert prepared.provenance["resolved_commit"] == revision
              assert prepared.provenance["sparse_patterns"] == strategy["sparse_patterns"]
              tree = subprocess.check_output(
                  ["git", "-C", str(prepared.path), "ls-tree", "-r", "-z", "--long", "HEAD"],
              )
              want = {}
              for record in tree.split(b"\x00"):
                  if not record:
                      continue
                  attrs, raw_path = record.split(b"\t", 1)
                  mode, kind, sha, size = attrs.decode("ascii").split()
                  path = raw_path.decode("utf-8")
                  if re.fullmatch(r"[^/]+/[^/]+_TT(?:/.*|\.zip)", path):
                      assert kind == "blob", (path, kind)
                      want[path] = int(size)

              got = {
                  candidate.relative_to(prepared.path).as_posix(): candidate.stat().st_size
                  for candidate in prepared.path.rglob("*")
                  if candidate.is_file() and
                  ".git" not in candidate.relative_to(prepared.path).parts
              }
              assert len(want) == 565, ("upstream pinned TT inventory changed", len(want))
              assert sum(want.values()) == 220289125, ("unexpected upstream TT bytes", sum(want.values()))
              missing = set(want) - set(got)
              unwanted = set(got) - set(want)
              assert not missing, ("missing sparse TT paths", sorted(missing)[:15])
              assert not unwanted, ("unwanted checked-out source paths", sorted(unwanted)[:15])
              changed = [p for p, size in want.items() if got[p] != size]
              assert not changed, ("unexpected TT worktree sizes", changed[:15])
              print(f"PASS: {len(got)} exact TT blob files, {sum(got.values())} bytes, pinned {revision}")
          finally:
              prepared.cleanup()
          PY
