name: ORACC published RIAO/RINAP release consumer

on:
  pull_request:
    paths:
      - '.github/workflows/oracc-release-consumer.yml'
      - 'registry/resources.yaml'
      - 'plugins/context-fabric/resources/catalog.yaml'
      - 'plugins/context-fabric/src/agora_context_fabric/release_archive.py'
      - 'plugins/context-fabric/src/agora_context_fabric/release_resource.py'
      - 'plugins/context-fabric/src/agora_context_fabric/catalog.py'
      - 'plugins/context-fabric/src/agora_context_fabric/resolver.py'
      - 'plugins/context-fabric/src/agora_context_fabric/service_source_modes.py'
      - 'scripts/smoke_oracc_release_223.py'
      - 'tests/test_oracc_release_integration_223.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracc-release-consumer.yml'
      - 'plugins/context-fabric/src/agora_context_fabric/release_resource.py'
      - 'scripts/smoke_oracc_release_223.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pinned-release-load:
    name: Verify public ORACC release bytes in Context-Fabric and offline cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove exact head under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Context-Fabric and validation test runtime
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e plugins/context-fabric

      - name: Fail closed on malicious fixture and immutable metadata deviations
        run: python -m unittest discover -s tests -p 'test_oracc_release_integration_223.py' -v

      - name: Download published v1.0.0 bytes, query native TF and reload offline
        run: python scripts/smoke_oracc_release_223.py
