name: PR79 Stage A evidence linker

on:
  push:
    branches:
      - implement/resource-member-verification-19

permissions:
  contents: write

jobs:
  link-community-evidence:
    if: github.repository == 'alexsosn/Agora'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: implement/resource-member-verification-19
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install YAML support
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Link staged community evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          resources_path = Path('registry/resources.yaml')
          resources_text = resources_path.read_text(encoding='utf-8')

          def link_resource(text: str, resource_id: str, check_id: str) -> str:
              pattern = re.compile(
                  rf'(?ms)(^- id: {re.escape(resource_id)}\n(?:(?!^- id: ).)*?^  verification:) \{{status: community\}}'
              )
              replacement = (
                  r'\1\n'
                  '    status: community\n'
                  '    evidence:\n'
                  f'    - check_id: {check_id}'
              )
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'expected exactly one unlinked community record for {resource_id}, found {count}')
              return updated

          resources_text = link_resource(resources_text, 'bhsa', 'resource-load/bhsa')
          resources_text = link_resource(resources_text, 'cuc', 'resource-load/cuc')
          resources_path.write_text(resources_text, encoding='utf-8')

          greek_path = Path('registry/collections/greek_literature.yaml')
          greek_text = greek_path.read_text(encoding='utf-8')
          member_id = 'canonical-greeklit-tlg0012-tlg001-perseus-grc2-1-67402e1a'
          pattern = re.compile(
              rf'(?ms)(^- id: {re.escape(member_id)}\n(?:(?!^- id: ).)*?^  verification:\n    status: community)(?=\n)'
          )
          replacement = (
              r'\1\n'
              '    evidence:\n'
              '    - check_id: member-load/greek-iliad'
          )
          greek_text, count = pattern.subn(replacement, greek_text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one unlinked Iliad community record, found {count}')
          greek_path.write_text(greek_text, encoding='utf-8')

          resources = yaml.safe_load(resources_path.read_text(encoding='utf-8'))['resources']
          by_id = {item['id']: item for item in resources}
          assert by_id['bhsa']['verification'] == {
              'status': 'community', 'evidence': [{'check_id': 'resource-load/bhsa'}]
          }
          assert by_id['cuc']['verification'] == {
              'status': 'community', 'evidence': [{'check_id': 'resource-load/cuc'}]
          }
          greek = yaml.safe_load(greek_path.read_text(encoding='utf-8'))
          iliad = next(item for item in greek['members'] if item['id'] == member_id)
          assert iliad['verification'] == {
              'status': 'community', 'evidence': [{'check_id': 'member-load/greek-iliad'}]
          }
          PY

      - name: Regenerate Context-Fabric projections
        run: python scripts/generate_context_fabric_catalog.py

      - name: Validate staged registry and projections
        run: |
          python scripts/validate_registry.py
          python scripts/generate_context_fabric_catalog.py --check

      - name: Commit Stage A links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/resources.yaml registry/collections/greek_literature.yaml \
            plugins/context-fabric/resources/catalog.yaml \
            plugins/context-fabric/resources/collections/greek_literature.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Stage A changes to commit.'
            exit 0
          fi
          git commit -m 'Link staged resource verification evidence'
          git push origin HEAD:implement/resource-member-verification-19
