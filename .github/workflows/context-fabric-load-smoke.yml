name: Context-Fabric representative load smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - '.github/workflows/context-fabric-load-smoke.yml'
      - 'registry/resources.yaml'
      - 'registry/feature-modules.yaml'
      - 'registry/collections/**'
      - 'registry/verification-checks.yaml'
      - 'registry/schema/verification-checks.schema.json'
      - 'plugins/context-fabric/resources/collections/**'
      - 'plugins/context-fabric/pyproject.toml'
      - 'plugins/context-fabric/src/**'
      - 'scripts/smoke_context_fabric_cold_load.py'
      - 'scripts/smoke_context_fabric_resources.py'
      - 'tests/test_context_fabric_load_smoke.py'
      - 'tests/test_context_fabric_load_smoke_workflow.py'
      - 'tests/test_resource_member_verification_live_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/context-fabric-load-smoke.yml'
      - 'registry/resources.yaml'
      - 'registry/feature-modules.yaml'
      - 'registry/collections/**'
      - 'registry/verification-checks.yaml'
      - 'registry/schema/verification-checks.schema.json'
      - 'plugins/context-fabric/resources/collections/**'
      - 'plugins/context-fabric/pyproject.toml'
      - 'plugins/context-fabric/src/**'
      - 'scripts/smoke_context_fabric_cold_load.py'
      - 'scripts/smoke_context_fabric_resources.py'
      - 'tests/test_context_fabric_load_smoke.py'
      - 'tests/test_context_fabric_load_smoke_workflow.py'
      - 'tests/test_resource_member_verification_live_workflow.py'

permissions:
  contents: read

concurrency:
  group: context-fabric-load-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cold-load:
    name: Exercise contained cold-load subprocess
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Agora
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Context-Fabric runtime
        run: python -m pip install -e plugins/context-fabric

      - name: Exercise contained cold-load subprocess
        run: python scripts/smoke_context_fabric_cold_load.py

  representative-loads:
    name: Load ${{ matrix.case }} and bind ${{ matrix.check_id }}
    runs-on: ubuntu-24.04
    # Includes the cache lifecycle: unload/remove/prune and a cold reload.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: bhsa, check_id: resource-load/bhsa}
          - {case: cuc, check_id: resource-load/cuc}
          - {case: greek-iliad, check_id: member-load/greek-iliad}
          - {case: greek-known-bad, check_id: member-canary/greek-argonautica}
    env:
      AGORA_CORPUS_CACHE_MAX_GB: '5'
      AGORA_CORPUS_MIN_FREE_GB: '2'

    steps:
      - name: Check out Agora
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore case-local Context-Fabric corpus cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/agora/context-fabric-smoke/${{ matrix.case }}
          key: ${{ runner.os }}-context-fabric-load-${{ matrix.case }}-${{ hashFiles('registry/resources.yaml', 'registry/verification-checks.yaml', 'plugins/context-fabric/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-context-fabric-load-${{ matrix.case }}-

      - name: Install Context-Fabric runtime
        run: python -m pip install -e plugins/context-fabric

      - name: Load exact representative subject, assert semantics, and exercise cache cleanup
        shell: bash
        run: |
          set -o pipefail
          python scripts/smoke_context_fabric_resources.py \
            "${{ matrix.case }}" \
            --check-id "${{ matrix.check_id }}" \
            --lifecycle \
            --cache-dir "$HOME/.cache/agora/context-fabric-smoke/${{ matrix.case }}" \
            | tee "context-fabric-load-${{ matrix.case }}.jsonl"

      - name: Upload subject-bound smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-fabric-load-${{ matrix.case }}
          path: context-fabric-load-${{ matrix.case }}.jsonl
          if-no-files-found: warn

  feature-module-load:
    # Regression smoke for a parent corpus + feature-module overlay. It is not
    # bound to a registry verification check and promotes no module evidence.
    name: Load BHSA with the bhsa-phono feature module and exercise cache cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AGORA_CORPUS_CACHE_MAX_GB: '5'
      AGORA_CORPUS_MIN_FREE_GB: '2'

    steps:
      - name: Check out Agora
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore feature-module Context-Fabric corpus cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/agora/context-fabric-smoke/bhsa-phono
          key: ${{ runner.os }}-context-fabric-load-bhsa-phono-${{ hashFiles('registry/resources.yaml', 'registry/feature-modules.yaml', 'plugins/context-fabric/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-context-fabric-load-bhsa-phono-

      - name: Install Context-Fabric runtime
        run: python -m pip install -e plugins/context-fabric

      - name: Load BHSA + bhsa-phono, assert module semantics, and exercise cache cleanup
        shell: bash
        run: |
          set -o pipefail
          python scripts/smoke_context_fabric_resources.py \
            bhsa-phono \
            --lifecycle \
            --cache-dir "$HOME/.cache/agora/context-fabric-smoke/bhsa-phono" \
            | tee context-fabric-load-bhsa-phono.jsonl

      - name: Upload feature-module smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-fabric-load-bhsa-phono
          path: context-fabric-load-bhsa-phono.jsonl
          if-no-files-found: warn
