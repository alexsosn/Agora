name: Temporary corpus GREEN5 integration

on:
  push:
    branches:
      - feat/corpus-version-tracking-108

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/corpus-version-tracking-108
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply focused GREEN5 script fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          check = Path("scripts/check_corpus_versions.py")
          text = check.read_text(encoding="utf-8")
          marker = "# GREEN5 proposal-layer integration"
          if marker not in text:
              if not text.endswith("\n"):
                  text += "\n"
              text += '''\n# GREEN5 proposal-layer integration\nfrom scripts.corpus_version_proposal import apply_promotions_to_text as apply_promotions_to_text\n\nif __name__ == "__main__":\n    from scripts.corpus_version_proposal import main as _corpus_version_proposal_main\n    raise SystemExit(_corpus_version_proposal_main())\n'''
              check.write_text(text, encoding="utf-8")

          proposal = Path("scripts/corpus_version_proposal.py")
          text = proposal.read_text(encoding="utf-8")
          old = '''        current_accepted = tracking.get("accepted")\n        if current_accepted != previous:\n            raise ReleaseDiscoveryError(\n                f"stale accepted state for resource {resource_id!r}: current state changed from expected previous state"\n            )\n'''
          new = '''        current_accepted = tracking.get("accepted")\n        comparable_current = copy.deepcopy(current_accepted)\n        if isinstance(comparable_current, Mapping) and isinstance(previous, Mapping):\n            current_revision = comparable_current.get("source_revision")\n            if current_revision is not None:\n                comparable_current["source_revision"] = str(current_revision)\n        if comparable_current != previous:\n            raise ReleaseDiscoveryError(\n                f"stale accepted state for resource {resource_id!r}: current state changed from expected previous state"\n            )\n'''
          if old not in text and new not in text:
              raise SystemExit("expected stale-state block not found")
          if old in text:
              proposal.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify RED5 script contracts are GREEN
        run: |
          python -m py_compile scripts/check_corpus_versions.py scripts/corpus_version_proposal.py
          python -m unittest tests.test_corpus_version_registry_proposal_red5 -v
      - name: Commit script fixes when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/check_corpus_versions.py scripts/corpus_version_proposal.py; then
            echo "GREEN5 script fixes already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_corpus_versions.py scripts/corpus_version_proposal.py
          git commit -m "GREEN5: integrate corpus registry proposal layer"
          git push origin HEAD:feat/corpus-version-tracking-108
