name: Temporary corpus GREEN5 integration

on:
  push:
    branches:
      - feat/corpus-version-tracking-108

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/corpus-version-tracking-108
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Add proposal export and CLI entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/check_corpus_versions.py")
          text = path.read_text(encoding="utf-8")
          marker = "# GREEN5 proposal-layer integration"
          if marker not in text:
              if not text.endswith("\n"):
                  text += "\n"
              text += '''\n# GREEN5 proposal-layer integration\nfrom scripts.corpus_version_proposal import apply_promotions_to_text as apply_promotions_to_text\n\nif __name__ == "__main__":\n    from scripts.corpus_version_proposal import main as _corpus_version_proposal_main\n    raise SystemExit(_corpus_version_proposal_main())\n'''
              path.write_text(text, encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify RED5 contracts are GREEN
        run: |
          python -m py_compile scripts/check_corpus_versions.py scripts/corpus_version_proposal.py
          python -m unittest discover -s tests -p 'test_corpus_version_*red5.py' -v
      - name: Commit clean GREEN5 head
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-corpus-green5.yml
          git add scripts/check_corpus_versions.py
          git commit -m "GREEN5: wire corpus proposal CLI and registry mutator"
          git push origin HEAD:feat/corpus-version-tracking-108
