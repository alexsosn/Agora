name: TLHdig registry 154

on:
  pull_request:

permissions:
  contents: write

jobs:
  focused:
    if: github.head_ref == 'fix/tlhdig-current-path-154' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Update canonical TLHdig resource
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('registry/resources.yaml')
          text = path.read_text(encoding='utf-8')
          old_upstream = 'upstream: {repository: alexsosn/TLHdig-TF, tf_path: tf/0.1.0}'
          new_upstream = 'upstream: {repository: alexsosn/TLHdig-TF, tf_path: tf/0.4.0}'
          old_note = 'notes: Follow the upstream default branch so rebuilt tf/0.1.0 datasets are picked up without changing the version label.'
          new_note = 'notes: Follow the upstream default branch so rebuilt tf/0.4.0 datasets are picked up without introducing a revision pin.'
          assert text.count(old_upstream) == 1, 'unexpected TLHdig upstream registry shape'
          assert text.count(old_note) == 1, 'unexpected TLHdig acquisition note shape'
          text = text.replace(old_upstream, new_upstream).replace(old_note, new_note)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate installed Context-Fabric catalog
        run: |
          python scripts/generate_context_fabric_catalog.py
          python scripts/generate_context_fabric_catalog.py --check
      - name: Focused registry contract
        run: python -m unittest discover -s tests -p 'test_tlhdig_current_registry.py' -v
      - name: Bounded upstream current-artifact smoke
        run: |
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/alexsosn/TLHdig-TF/main/tf/0.4.0/otype.tf > /tmp/tlhdig-otype.tf
          grep -Fq '@version=0.4.0' /tmp/tlhdig-otype.tf
          grep -Fq '@license=CC-BY-4.0' /tmp/tlhdig-otype.tf
      - name: Commit canonical and generated registry update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/resources.yaml plugins/context-fabric/resources/catalog.yaml
          git commit -m 'fix: move TLHdig registry to current artifact'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
