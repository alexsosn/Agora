name: TLHdig registry 154

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused:
    if: github.head_ref == 'fix/tlhdig-current-path-154'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_tlhdig_current_registry.py' -v
