name: Materializer execution identity research

on:
  pull_request:
    paths:
      - scripts/agora_install_materializer.py
      - tests/test_materializer_execution_identity_research.py
      - .github/workflows/materializer-execution-identity-research.yml

permissions:
  contents: read

jobs:
  clean-install-inventory:
    name: Clean install inventory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install research dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Inventory two clean managed installs
        run: python -m unittest discover -s tests -p 'test_materializer_execution_identity_research.py' -v
