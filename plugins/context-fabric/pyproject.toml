[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-context-fabric"
version = "0.1.0"
description = "Agora resource discovery and lazy loading for Context-Fabric MCP"
requires-python = ">=3.13"
dependencies = [
  "cfabric-mcp==0.1.7",
  "context-fabric==0.5.7",
  "PyYAML>=6.0,<7",
]

[project.scripts]
agora-context-fabric-mcp = "agora_context_fabric.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agora_context_fabric*"]
