[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-sedra"
version = "0.1.0"
description = "Agora MCP adapter for the public SEDRA IV Syriac lexical API"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.12.0,<3",
  # cryptography ships no CPython macOS x86_64 wheel after 42.x, so Intel Macs
  # would otherwise source-build it (and need a Rust toolchain) at MCP launch.
  'cryptography<43; platform_system == "Darwin" and platform_machine == "x86_64"',
]

[project.scripts]
agora-sedra-mcp = "agora_sedra.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agora_sedra*"]
